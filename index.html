<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>경인교대 파주동문회</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f7;color:#152033}.loading{width:min(520px,calc(100% - 32px));margin:80px auto;padding:24px;border:1px solid #d8dee8;border-radius:8px;background:#fff;font-weight:800;text-align:center}.hint{margin-top:10px;color:#667085;font-size:14px;font-weight:600}
  </style>
</head>
<body>
  <div class="loading">동문회 화면을 복구하는 중입니다...<div class="hint">잠시만 기다려 주세요.</div></div>
  <script>
    (async function(){
      const source='https://raw.githubusercontent.com/shupapa05/pajuar/3f001b15fe4b36c6b7b2fac32be59ed39845a7ed/index.html?restore=' + Date.now();
      try{
        let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('load failed');return r.text()});
        const patch=`<script>
(function(){
  function ready(){return typeof db!=='undefined' && typeof state!=='undefined' && typeof $!=='undefined'}
  function wait(fn){let count=0;const timer=setInterval(function(){count++;try{if(fn()){clearInterval(timer)}}catch(e){}if(count>80)clearInterval(timer)},250)}
  wait(function(){
    if(!ready()) return false;
    const phone=document.getElementById('regPhone');
    if(phone) phone.placeholder='예: 010-0000-0000';
    const pin=document.getElementById('adminPin');
    if(pin && !pin.dataset.enterReady){pin.dataset.enterReady='1';pin.addEventListener('keydown',function(e){if(e.key==='Enter' && typeof adminLogin==='function') adminLogin()})}
    return true;
  });
  wait(function(){
    if(!ready() || typeof renderMembers!=='function' || typeof loadAdminData!=='function') return false;
    window.loadAdminData=async function(){
      const res=await db.rpc('get_admin_alumni_app_data',{p_pin:state.adminPin});
      if(res.error){ if(typeof showAdminMsg==='function') showAdminMsg(res.error.message,'warn'); return; }
      const d=res.data||{};
      state.isMainAdmin=!!d.is_main_admin;
      state.adminMembers=d.members||d.adminMembers||d.memberList||state.adminMembers||state.members||[];
      state.members=state.adminMembers;
      state.adminNotices=d.notices||state.adminNotices||[];
      state.adminEvents=d.events||state.adminEvents||[];
      state.feeUses=d.fee_uses||state.feeUses||[];
      state.attendanceList=d.attendance_list||state.attendanceList||[];
      if(typeof renderAllAdmin==='function') renderAllAdmin(); else renderMembers();
      if(typeof showAdminMsg==='function') showAdminMsg(state.isMainAdmin?'메인관리자로 로그인했습니다.':'일반관리자로 로그인했습니다.','success');
    };
    window.adminLogin=async function(){
      const pin=$('adminPin').value.trim();
      const ok=await db.rpc('verify_admin_pin',{p_pin:pin});
      if(ok.error||!ok.data){ if(typeof showAdminMsg==='function') showAdminMsg('PIN을 확인해 주세요.','warn'); return; }
      state.adminPin=pin;
      const box=$('adminLoginBox'); if(box) box.classList.add('hidden');
      const panel=$('adminPanel'); if(panel) panel.classList.remove('hidden');
      await window.loadAdminData();
      if(typeof showAdminPanel==='function') showAdminPanel('members');
    };
    const btn=document.getElementById('adminLoginBtn'); if(btn) btn.onclick=window.adminLogin;
    const originalRender=renderMembers;
    window.renderMembers=function(){
      originalRender();
      const isMain=!!state.isMainAdmin;
      const table=document.getElementById('memberTableBody');
      if(!table) return;
      const header=table.closest('table')?.querySelector('thead tr');
      if(header && isMain && !header.querySelector('[data-main-col]')){const th=document.createElement('th');th.dataset.mainCol='1';th.textContent='관리';header.appendChild(th)}
      if(!isMain) return;
      Array.from(table.querySelectorAll('tr')).forEach(function(tr){
        if(tr.classList.contains('group-row')){const td=tr.querySelector('td'); if(td) td.colSpan=7; return;}
        if(tr.querySelector('[data-member-actions]')) return;
        const name=(tr.children[1]?.textContent||'').trim();
        const gen=(tr.children[2]?.textContent||'').replace(/[^0-9]/g,'').trim();
        const member=(state.members||state.adminMembers||[]).find(function(m){return String(m.name||'')===name && String(m.generation||'')===gen});
        const td=document.createElement('td');td.dataset.memberActions='1';
        if(!member||!member.member_id){td.textContent='-';tr.appendChild(td);return;}
        td.innerHTML='<button class="btn btn-light" data-edit-member="'+member.member_id+'">수정</button> <button class="btn btn-light" data-hide-member="'+member.member_id+'">숨김</button> <button class="btn btn-dark" data-delete-member="'+member.member_id+'">삭제</button>';
        tr.appendChild(td);
      });
      table.querySelectorAll('[data-edit-member]').forEach(function(b){b.onclick=function(){editMemberMain(b.dataset.editMember)}});
      table.querySelectorAll('[data-hide-member]').forEach(function(b){b.onclick=function(){hideMemberMain(b.dataset.hideMember)}});
      table.querySelectorAll('[data-delete-member]').forEach(function(b){b.onclick=function(){deleteMemberMain(b.dataset.deleteMember)}});
    };
    window.editMemberMain=async function(id){
      const m=(state.members||state.adminMembers||[]).find(x=>x.member_id===id); if(!m)return;
      const name=prompt('이름',m.name||''); if(name===null)return;
      const student=prompt('학번',m.student_no||m.studentNo||''); if(student===null)return;
      const position=prompt('직위',m.position||''); if(position===null)return;
      const school=prompt('학교',m.school||m.org||''); if(school===null)return;
      const phone=prompt('연락처',m.phone||''); if(phone===null)return;
      const res=await db.rpc('admin_update_member',{p_pin:state.adminPin,p_member_id:id,p_name:name,p_student_no:student,p_position:position,p_school:school,p_phone:phone});
      if(res.error){showAdminMsg(res.error.message,'warn');return} await window.loadAdminData(); showAdminMsg('회원 정보를 수정했습니다.','success');
    };
    window.hideMemberMain=async function(id){if(!confirm('이 회원을 명단에서 숨길까요?'))return;const res=await db.rpc('admin_hide_member',{p_pin:state.adminPin,p_member_id:id});if(res.error){showAdminMsg(res.error.message,'warn');return}await window.loadAdminData();showAdminMsg('회원을 숨김 처리했습니다.','success')};
    window.deleteMemberMain=async function(id){if(!confirm('이 회원을 완전히 삭제할까요?'))return;if(!confirm('정말 삭제합니다. 복구가 어렵습니다.'))return;const res=await db.rpc('admin_delete_member',{p_pin:state.adminPin,p_member_id:id});if(res.error){showAdminMsg(res.error.message,'warn');return}await window.loadAdminData();showAdminMsg('회원을 삭제했습니다.','success')};
    return true;
  });
})();
<\/script>`;
        html=html.replace('</body>',patch+'</body>');
        document.open();document.write(html);document.close();
      }catch(e){
        document.body.innerHTML='<div class="loading">화면 복구에 실패했습니다.<div class="hint">새로고침 후 다시 시도해 주세요.</div></div>';
      }
    })();
  </script>
</body>
</html>
