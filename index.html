<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>경인교대 파주동문회</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{min-height:42px;border:0;border-radius:8px;padding:9px 14px;background:#176b87;color:#fff;font-weight:800;cursor:pointer}.light{background:#e9edf3;color:#172033}.dark{background:#27364a}.danger{background:#9f2a2a}.app{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:24px 0 48px}.card,.hero{background:#fff;border:1px solid #d8dee8;border-radius:8px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:22px}.hero h1{margin:0;font-size:34px}.muted{color:#667085;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat-title{grid-column:1/-1;padding:14px 16px;background:#172033;color:#fff;border-radius:8px;font-weight:900;font-size:18px}.stat-title span{display:block;margin-top:4px;color:#cbd5e1;font-size:13px}.stat{padding:14px;background:#fff;border:1px solid #d8dee8;border-radius:8px}.stat span{display:block;color:#667085;font-weight:800}.stat b{font-size:28px}.tabs,.subtabs{display:grid;gap:10px;margin:14px 0}.tabs{grid-template-columns:repeat(4,1fr)}.subtabs{grid-template-columns:repeat(3,1fr)}.tabs button,.subtabs button{background:#27364a}.active{background:#176b87!important}.card{padding:20px;margin-top:14px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.wide{grid-column:1/-1}label{display:grid;gap:6px;font-weight:800}input,select,textarea{width:100%;min-height:42px;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;background:#fff}textarea{min-height:110px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.msg{margin:12px 0;padding:11px 13px;border-radius:8px;background:#fff4d8;color:#7a4b00;font-weight:800}.ok{background:#e7f7ed!important;color:#126233!important}.bad{background:#fee2e2!important;color:#991b1b!important}.notice,.item{border:1px solid #e2e8f0;border-radius:8px;background:#fbfcfe;margin-bottom:10px;padding:15px}.notice p{white-space:pre-line;line-height:1.7}.table-wrap{overflow:auto;border:1px solid #dfe6ef;border-radius:8px;background:#fff}.tbl{width:100%;border-collapse:collapse;min-width:850px}.tbl th,.tbl td{border-bottom:1px solid #edf1f5;padding:11px;text-align:center;font-size:14px}.tbl th{background:#f6f8fb}.group td{background:#f8fafc!important;border-top:2px solid #cbd8eb;text-align:left!important;font-weight:900}.group-title{display:flex;justify-content:space-between;gap:12px}.pill{display:inline-flex;border-radius:999px;padding:5px 10px;font-weight:900;font-size:13px}.attend{background:#dcfce7;color:#166534}.absent{background:#fee2e2;color:#991b1b}.pending{background:#e5e7eb;color:#374151}.delegate{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}.admin-title{display:none}.admin-only .hero,.admin-only #stats,.admin-only #mainTabs{display:none}.admin-only .admin-title{display:block}@media(max-width:780px){.hero,.grid,.filters,.stats,.tabs,.subtabs{display:grid;grid-template-columns:1fr}.hero button{width:100%}}
</style>
</head>
<body>
<main class="app">
<section class="hero"><div><div id="year" class="muted">불러오는 중</div><h1 id="name">경인교대 파주동문회</h1></div><button id="guideBtn">행사 안내</button></section>
<section class="admin-title card"><div class="muted">관리자 전용</div><h1>동문회 관리</h1></section>
<section id="stats" class="stats"><div class="stat-title"><div id="stEventTitle">행사 참석 현황</div><span>아래 인원은 선택된 행사 기준입니다.</span></div><div class="stat"><span>전체</span><b id="stTotal">-</b></div><div class="stat"><span>참석</span><b id="stAttend">-</b></div><div class="stat"><span>불참</span><b id="stAbsent">-</b></div><div class="stat"><span>미응답</span><b id="stPending">-</b></div></section>
<nav id="mainTabs" class="tabs"><button data-view="notices">공지사항</button><button data-view="register">회원 등록</button><button data-view="attendance">행사 참석</button><button data-view="admin">관리자</button></nav>
<div id="msg" class="msg hidden"></div>
<section id="noticesView" class="card"></section>
<section id="registerView" class="card hidden"><h2>회원 등록</h2><div class="grid"><label>이름<input id="regName"></label><label>학번<input id="regStudentNo" inputmode="numeric" placeholder="예: 90"></label><label>직위<select id="regPosition"><option value="">선택</option><option>교사</option><option>교감</option><option>교장</option><option>늘봄실장</option><option>장학사</option><option>장학관</option><option>기타</option></select></label><label>현재 학교<input id="regSchool" list="schoolList"></label><label class="wide">연락처<input id="regPhone" inputmode="tel" placeholder="예: 010-0000-0000"></label></div><datalist id="schoolList"></datalist><label class="row" style="margin:12px 0"><input id="regAgree" type="checkbox" style="width:18px;min-height:18px"> 개인정보 수집 및 이용에 동의합니다.</label><button id="registerBtn">등록하기</button><div id="registerMsg" class="msg hidden"></div></section>
<section id="attendanceView" class="card hidden"><h2>행사 참석</h2><div id="eventBox" class="notice"></div><div class="grid"><label>이름<input id="attName"></label><label>동명이인 확인<input id="attSchool" list="schoolList" placeholder="필요할 때 학교명 입력"></label></div><div class="row" style="margin-top:12px"><button data-att="참석" class="dark">참석</button><button data-att="불참" class="dark">불참</button><button id="attSave">저장하기</button></div><div id="attMsg" class="msg hidden"></div></section>
<section id="adminView" class="card hidden"><div id="loginBox"><h2>관리자 로그인</h2><label>관리자 PIN<input id="adminPin" type="password"></label><div class="row" style="justify-content:flex-end;margin-top:10px"><button id="loginBtn">로그인</button></div></div><div id="adminMsg" class="msg hidden"></div><div id="adminPanel" class="hidden"><nav class="tabs"><button data-admin="members">명단</button><button data-admin="notices">공지사항</button><button data-admin="fees">회비</button><button data-admin="events">행사</button></nav>
<section id="membersPanel"><div class="row" style="justify-content:space-between"><h2>회원명단</h2><button id="refreshBtn">새로고침</button></div><div id="memberSummary" class="row"></div><div class="filters"><select id="mSchool"></select><select id="mPosition"></select><select id="mGeneration"></select><select id="mSort"><option value="school">학교/직위/이름순</option><option value="genA">기수 오름차순</option><option value="genD">기수 내림차순</option></select><input id="mKeyword" placeholder="이름 / 학번 / 전화번호 검색"></div><div class="table-wrap"><table class="tbl"><thead><tr id="memberHead"></tr></thead><tbody id="memberBody"></tbody></table></div></section>
<section id="noticesPanel" class="hidden"><h2>공지사항 관리</h2><div class="grid"><div class="item"><input id="noticeId" type="hidden"><input id="noticeFileUrl" type="hidden"><input id="noticeFileName" type="hidden"><label>제목<input id="noticeTitle"></label><label class="wide">내용<textarea id="noticeContent"></textarea></label><label class="wide">첨부파일<input id="noticeFile" type="file" accept=".pdf,.png,.jpg,.jpeg,.hwp,.doc,.docx"></label><div id="noticeFileInfo" class="muted wide">첨부파일 없음</div><label class="row"><input id="noticePublic" type="checkbox" checked style="width:18px;min-height:18px"> 공개</label><label class="row"><input id="noticeImportant" type="checkbox" style="width:18px;min-height:18px"> 중요</label><div class="row wide"><button id="saveNoticeBtn">공지 저장</button><button id="resetNoticeBtn" class="light">새 공지</button><button id="deleteNoticeBtn" class="danger">공지 삭제</button></div></div><div id="noticeAdminList"></div></div></section>
<section id="feesPanel" class="hidden"><h2>회비 관리</h2><nav class="subtabs"><button data-fee-tab="pay">회비납부</button><button data-fee-tab="use">사용</button><button data-fee-tab="report">결산</button></nav><div id="feePayPanel"><div id="feeSummary" class="row"></div><div class="filters"><select id="feePaidFilter"><option value="">전체 납부상태</option><option value="paid">납부</option><option value="unpaid">미납</option></select><select id="feePositionFilter"></select><input id="feeKeyword" placeholder="이름 / 학교 / 기수 검색"></div><div class="table-wrap"><table class="tbl"><thead><tr><th>성명</th><th>기수</th><th>직위</th><th>학교</th><th>회비</th><th>납부</th><th>납부일</th></tr></thead><tbody id="feeBody"></tbody></table></div></div><div id="feeUsePanel" class="hidden"><div class="item"><input id="feeUseId" type="hidden"><div class="grid"><label>날짜<input id="feeUseDate" type="date"></label><label>관<select id="feeUseCategory"><option>수입</option><option>운영비</option><option>행사비</option></select></label><label>항<select id="feeUseSub"></select></label><label id="feeUseCustomWrap" class="hidden">항 직접입력<input id="feeUseCustom"></label><label>목<input id="feeUseItem"></label><label>수입<input id="feeUseIncome" type="number" value="0"></label><label>지출<input id="feeUseExpense" type="number" value="0"></label><label class="wide">비고<input id="feeUseNote"></label></div><div class="row"><button id="saveFeeUseBtn">사용내역 저장</button><button id="resetFeeUseBtn" class="light">새로쓰기</button></div></div><div class="table-wrap"><table class="tbl"><thead><tr><th>날짜</th><th>관</th><th>항</th><th>목</th><th>수입</th><th>지출</th><th>비고</th><th>관리</th></tr></thead><tbody id="feeUseBody"></tbody></table></div></div><div id="feeReportPanel" class="hidden"><div id="reportBox" class="notice"></div></div></section>
<section id="eventsPanel" class="hidden"><h2>행사 관리</h2><nav class="subtabs" style="grid-template-columns:repeat(2,1fr)"><button data-event-tab="manage">행사관리</button><button data-event-tab="attend">참석현황</button></nav><div id="eventManagePanel"><div class="grid"><div class="item"><input id="eventId" type="hidden"><label>행사명<input id="eventTitle"></label><label>행사일<input id="eventDate" type="date"></label><label>장소<input id="eventPlace"></label><label class="wide">내용<textarea id="eventContent"></textarea></label><label>PDF 파일 첨부<input id="eventPdfFile" type="file" accept="application/pdf,.pdf"></label><label>PDF 이름<input id="eventPdfName" placeholder="첨부하면 자동 입력됩니다"></label><label class="wide">PDF 주소<input id="eventPdfUrl" placeholder="첨부하면 자동 입력됩니다"></label><div class="row wide"><button id="saveEventBtn">행사 저장</button><button id="resetEventBtn" class="light">새 행사</button><button id="deleteEventPdfBtn" class="danger">PDF 삭제</button></div></div><div id="eventList"></div></div></div><div id="eventAttendPanel" class="hidden"><div id="attSummary" class="row"></div><div class="table-wrap"><table class="tbl"><thead><tr><th>기수</th><th>이름</th><th>학교</th><th>직위</th><th>참석여부</th><th>수정일</th></tr></thead><tbody id="attBody"></tbody></table></div></div></section></div></section>
</main>
<script>
var db=supabase.createClient('https://lemwzcchuazqpsyzsoff.supabase.co','sb_publishable_dXOuhuPizNsQgCXtqQYY4A_DBk6WCGV');
var S={settings:{},notices:[],events:[],schools:[],summary:{},attChoice:'',pin:'',isMain:false,members:[],adminNotices:[],adminEvents:[],feeUses:[],feeSummary:{},attList:[]};
var $=function(id){return document.getElementById(id)};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(v){return Number(v||0).toLocaleString()}
function date(v){if(!v)return'';var d=new Date(String(v).indexOf('T')>-1?v:String(v)+'T00:00:00');return isNaN(d)?String(v):d.toLocaleDateString('ko-KR')}
function eventDate(v){if(!v)return'';var d=new Date(String(v).indexOf('T')>-1?v:String(v)+'T00:00:00');return isNaN(d)?String(v):(d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+'('+['일','월','화','수','목','금','토'][d.getDay()]+')')}
var isAdmin=new URLSearchParams(location.search).get('admin')==='1'; if(isAdmin)document.body.classList.add('admin-only');
function showMsg(id,t,cls){var e=$(id);if(!t){e.className='msg hidden';e.textContent='';return}e.className='msg '+(cls||'');e.textContent=t}
async function rpc(n,a){var r=await db.rpc(n,a||{});if(r.error)throw r.error;return r.data}
function fill(id,label,items){$(id).innerHTML='<option value="">'+label+'</option>'+items.map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+'</option>'}).join('')}
function activeEvent(){return S.events.find(function(e){return e.id===S.summary.event_id})||S.events.find(function(e){return e.active})||S.events[0]||null}
async function loadPublic(){var d=await rpc('get_public_alumni_app_data');S.settings=d.settings||{};S.notices=d.notices||[];S.events=d.events||[];S.schools=(d.schools||[]).map(function(x){return x.name||x});S.summary=d.attendance_summary||{};renderPublic()}
function renderPublic(){var e=activeEvent();$('name').textContent=S.settings.alumni_name||'경인교대 파주동문회';$('year').textContent=(S.settings.current_year||new Date().getFullYear())+'년도';$('stEventTitle').textContent=e?[e.title,eventDate(e.event_date),e.place].filter(Boolean).join(' '):'행사 참석 현황';$('stTotal').textContent=S.summary.total==null?'-':S.summary.total;$('stAttend').textContent=S.summary.attend==null?'-':S.summary.attend;$('stAbsent').textContent=S.summary.absent==null?'-':S.summary.absent;$('stPending').textContent=S.summary.pending==null?'-':S.summary.pending;$('schoolList').innerHTML=S.schools.map(function(s){return '<option value="'+esc(s)+'"></option>'}).join('');renderNotices();renderEventBox()}
function view(v){if(v==='admin'&&!isAdmin){window.open(location.pathname+'?admin=1&v=20260518d','_blank','noopener');return}['notices','register','attendance','admin'].forEach(function(x){$(x+'View').classList.toggle('hidden',x!==v)});document.querySelectorAll('[data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===v)})}
function renderNotices(){$('noticesView').innerHTML='<h2>공지사항</h2>'+(S.notices.length?S.notices.map(function(n){return '<article class="notice"><h3>'+esc(n.title)+'</h3><div class="muted">'+date(n.created_at)+'</div><p>'+esc(n.content||'')+'</p>'+(n.file_url?'<a target="_blank" href="'+esc(n.file_url)+'">첨부파일 보기'+(n.file_name?': '+esc(n.file_name):'')+'</a>':'')+'</article>'}).join(''):'<p>등록된 공지가 없습니다.</p>')}
function renderEventBox(){var e=activeEvent();$('eventBox').innerHTML=e?'<h3>'+esc(e.title)+'</h3><p>'+date(e.event_date)+(e.place?' · '+esc(e.place):'')+'</p><p>'+esc(e.content||'')+'</p>':'<p>현재 등록된 행사가 없습니다.</p>'}
async function guide(){var e=activeEvent();if(!e||!e.pdf_file_url){alert('행사안내가 없습니다.');return}window.open(e.pdf_file_url,'_blank')}
async function register(){try{showMsg('registerMsg','등록 중입니다...');var d=await rpc('register_alumni_member',{p_name:$('regName').value,p_student_no:$('regStudentNo').value,p_position:$('regPosition').value,p_school:$('regSchool').value,p_phone:$('regPhone').value,p_privacy_agreed:$('regAgree').checked});showMsg('registerMsg',(d&&d.message)||'등록되었습니다.','ok')}catch(e){showMsg('registerMsg',e.message,'bad')}}
async function saveAtt(){try{var e=activeEvent();if(!e)throw Error('현재 등록된 행사가 없습니다.');if(!S.attChoice)throw Error('참석 또는 불참을 선택해주세요.');showMsg('attMsg','저장 중입니다...');var d=await rpc('submit_event_attendance',{p_event_id:e.id,p_name:$('attName').value,p_school:$('attSchool').value,p_status:S.attChoice});showMsg('attMsg',(d&&d.message)||'저장되었습니다.','ok')}catch(e){showMsg('attMsg',e.message,'bad')}}
async function login(){try{S.pin=$('adminPin').value.trim();showMsg('adminMsg','관리자 화면을 불러오는 중입니다...');await loadAdmin();$('loginBox').classList.add('hidden');$('adminPanel').classList.remove('hidden');showMsg('adminMsg',S.isMain?'메인관리자로 로그인했습니다.':'일반관리자로 로그인했습니다.','ok');adminPanel('members')}catch(e){showMsg('adminMsg',e.message||'PIN을 확인해주세요.','bad')}}
async function loadAdmin(){var d=await rpc('get_admin_alumni_app_data',{p_pin:S.pin});S.isMain=!!d.is_main_admin;S.settings=d.settings||S.settings;S.members=d.members||[];S.adminNotices=d.notices||[];S.adminEvents=d.events||[];S.events=d.events||S.events;S.feeUses=d.fee_uses||[];S.feeSummary=d.fee_summary||{};S.attList=d.attendance_list||[];renderAdmin()}
function adminPanel(p){['members','notices','fees','events'].forEach(function(x){$(x+'Panel').classList.toggle('hidden',x!==p)});document.querySelectorAll('[data-admin]').forEach(function(b){b.classList.toggle('active',b.dataset.admin===p)});if(p==='events')eventTab('manage');if(p==='fees')feeTab('pay')}
function posRank(p){return ['교장','교감','장학관','장학사','교사','늘봄실장'].indexOf(String(p||''))}
function renderAdmin(){fill('mSchool','전체 학교',Array.from(new Set(S.members.map(function(m){return m.school}).filter(Boolean))).sort());fill('mPosition','전체 직위',Array.from(new Set(S.members.map(function(m){return m.position}).filter(Boolean))).sort());fill('mGeneration','전체 기수',Array.from(new Set(S.members.map(function(m){return String(m.generation||'')}).filter(Boolean))).sort(function(a,b){return Number(a)-Number(b)}));fill('feePositionFilter','전체 직위',Array.from(new Set(S.members.map(function(m){return m.position}).filter(Boolean))).sort());renderMembers();renderNoticeAdmin();renderFees();renderFeeUseOptions();renderFeeUses();renderReport();renderEvents();renderAttAdmin()}
function membersFiltered(){var l=S.members.slice(),sc=$('mSchool').value,po=$('mPosition').value,ge=$('mGeneration').value,kw=$('mKeyword').value.toLowerCase(),so=$('mSort').value;if(sc)l=l.filter(function(m){return m.school===sc});if(po)l=l.filter(function(m){return m.position===po});if(ge)l=l.filter(function(m){return String(m.generation||'')===ge});if(kw)l=l.filter(function(m){return String((m.name||'')+' '+(m.student_no||'')+' '+(m.phone||'')).toLowerCase().indexOf(kw)>-1});l.sort(function(a,b){if(so==='genA')return Number(a.generation||0)-Number(b.generation||0);if(so==='genD')return Number(b.generation||0)-Number(a.generation||0);var s=String(a.school||'').localeCompare(String(b.school||''),'ko');if(s)return s;var pa=posRank(a.position),pb=posRank(b.position);return (pa<0?99:pa)-(pb<0?99:pb)||String(a.name||'').localeCompare(String(b.name||''),'ko')});return l}
function groupText(list){var m={};list.forEach(function(x){var k=x.position||'미입력';m[k]=(m[k]||0)+1});return Object.keys(m).map(function(k){return esc(k)+' '+m[k]}).join(' · ')}

async function saveEvent(){try{var btn=$('saveEventBtn');btn.disabled=true;btn.textContent='저장 중...';var uploaded=await uploadEventPdfIfNeeded();var id=$('eventId').value||null;var current=(S.adminEvents||[]).find(function(x){return x.id===id});var pdfName=uploaded?uploaded.name:$('eventPdfName').value;var pdfUrl=uploaded?uploaded.url:$('eventPdfUrl').value;await rpc('admin_save_event',{p_pin:S.pin,p_id:id,p_title:$('eventTitle').value,p_event_date:$('eventDate').value||null,p_place:$('eventPlace').value,p_content:$('eventContent').value,p_pdf_file_url:pdfUrl,p_pdf_file_name:pdfName,p_active:current?!!current.active:false});resetEventForm();await loadAdmin();await loadPublic();showMsg('adminMsg','행사를 저장했습니다. 안내 여부는 행사 목록의 회원 안내로 선택 버튼에서 정합니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}finally{$('saveEventBtn').disabled=false;$('saveEventBtn').textContent='행사 저장'}}
async function selectEventGuide(id){var e=S.adminEvents.find(function(x){return x.id===id});if(!e)return;if(!e.pdf_file_url){showMsg('adminMsg','PDF가 첨부된 행사만 선택할 수 있습니다.','bad');return}try{showMsg('adminMsg','회원 안내 PDF를 변경하는 중입니다...');for(var i=0;i<(S.adminEvents||[]).length;i++){var x=S.adminEvents[i];await rpc('admin_save_event',{p_pin:S.pin,p_id:x.id,p_title:x.title,p_event_date:x.event_date,p_place:x.place,p_content:x.content,p_pdf_file_url:x.pdf_file_url,p_pdf_file_name:x.pdf_file_name,p_active:x.id===id})}await loadAdmin();await loadPublic();showMsg('adminMsg','선택한 PDF 1개만 회원 행사안내로 설정했습니다.','ok')}catch(err){showMsg('adminMsg',err.message,'bad')}}
async function deleteEventPdf(){var id=$('eventId').value;if(!id){showMsg('adminMsg','먼저 행사를 선택해주세요.','bad');return}if(!confirm('이 행사 PDF를 삭제할까요?'))return;try{await rpc('admin_delete_event_guide',{p_pin:S.pin,p_event_id:id});$('eventPdfName').value='';$('eventPdfUrl').value='';$('eventPdfFile').value='';await loadAdmin();await loadPublic();showMsg('adminMsg','PDF를 삭제했습니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}}
function ast(v){return v==='참석'||v==='불참'?v:'미응답'}function badge(v){var s=ast(v);return '<span class="pill '+(s==='참석'?'attend':s==='불참'?'absent':'pending')+'">'+s+'</span>'}
function renderAttAdmin(){var l=S.attList||[],at=l.filter(function(a){return ast(a.status)==='참석'}).length,ab=l.filter(function(a){return ast(a.status)==='불참'}).length;$('attSummary').innerHTML='<span class="pill pending">전체 '+l.length+'명</span><span class="pill attend">참석 '+at+'명</span><span class="pill absent">불참 '+ab+'명</span><span class="pill pending">미응답 '+(l.length-at-ab)+'명</span>';$('attBody').innerHTML=l.map(function(a){return '<tr><td>'+esc(a.generation)+'기</td><td>'+esc(a.name)+'</td><td>'+esc(a.school)+'</td><td>'+esc(a.position)+'</td><td>'+badge(a.status)+'</td><td>'+date(a.updated_at)+'</td></tr>'}).join('')}
document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){view(b.dataset.view)}});document.querySelectorAll('[data-admin]').forEach(function(b){b.onclick=function(){adminPanel(b.dataset.admin)}});document.querySelectorAll('[data-fee-tab]').forEach(function(b){b.onclick=function(){feeTab(b.dataset.feeTab)}});document.querySelectorAll('[data-event-tab]').forEach(function(b){b.onclick=function(){eventTab(b.dataset.eventTab)}});document.querySelectorAll('[data-att]').forEach(function(b){b.onclick=function(){S.attChoice=b.dataset.att;document.querySelectorAll('[data-att]').forEach(function(x){x.classList.toggle('active',x===b)});showMsg('attMsg',S.attChoice+'으로 선택되었습니다.','ok')}});
$('memberBody').addEventListener('click',function(e){var b=e.target.closest('button[data-act]');if(!b)return;var id=b.closest('tr').dataset.memberId;if(b.dataset.act==='edit')editMember(id);if(b.dataset.act==='hide')hideMember(id);if(b.dataset.act==='delete')deleteMember(id);if(b.dataset.act==='delegate')toggleDelegate(id)});
$('noticeAdminList').addEventListener('click',function(e){var b=e.target.closest('button[data-notice-act]');if(!b)return;if(b.dataset.noticeAct==='edit')fillNoticeForm(b.dataset.id);if(b.dataset.noticeAct==='delete'){fillNoticeForm(b.dataset.id);deleteNotice()}});
$('feeBody').addEventListener('change',function(e){var box=e.target.closest('input[data-fee-member]');if(!box)return;updateFee(box.dataset.feeMember,box.checked,box.dataset.feeAmount)});
$('feeUseBody').addEventListener('click',function(e){var b=e.target.closest('button[data-use-act]');if(!b)return;if(b.dataset.useAct==='edit')fillFeeUse(b.dataset.id);if(b.dataset.useAct==='delete')deleteFeeUse(b.dataset.id)});
$('reportBox').addEventListener('click',function(e){var b=e.target.closest('button[data-report-act]');if(!b)return;if(b.dataset.reportAct==='print')printReport()});
$('eventsPanel').addEventListener('click',function(e){var b=e.target.closest('button[data-event-act]');if(!b)return;if(b.dataset.eventAct==='edit')fillEventForm(b.dataset.id);if(b.dataset.eventAct==='select')selectEventGuide(b.dataset.id)});
$('noticeFile').addEventListener('change',function(){var f=this.files&&this.files[0];if(f){$('noticeFileInfo').textContent=f.name+' 첨부 예정'}});
$('eventPdfFile').addEventListener('change',function(){var f=this.files&&this.files[0];if(f){$('eventPdfName').value=f.name;$('eventPdfUrl').value='첨부 후 저장하면 자동 생성됩니다.'}});
$('guideBtn').onclick=guide;$('registerBtn').onclick=register;$('attSave').onclick=saveAtt;$('loginBtn').onclick=login;$('adminPin').onkeydown=function(e){if(e.key==='Enter')login()};$('refreshBtn').onclick=loadAdmin;$('saveNoticeBtn').onclick=saveNotice;$('resetNoticeBtn').onclick=resetNoticeForm;$('deleteNoticeBtn').onclick=deleteNotice;$('saveFeeUseBtn').onclick=saveFeeUse;$('resetFeeUseBtn').onclick=resetFeeUse;$('feeUseCategory').onchange=function(){renderFeeUseOptions()};$('feeUseSub').onchange=toggleFeeUseCustom;$('saveEventBtn').onclick=saveEvent;$('resetEventBtn').onclick=resetEventForm;$('deleteEventPdfBtn').onclick=deleteEventPdf;['mSchool','mPosition','mGeneration','mSort','mKeyword'].forEach(function(id){$(id).addEventListener(id==='mKeyword'?'input':'change',renderMembers)});['feePaidFilter','feePositionFilter','feeKeyword'].forEach(function(id){$(id).addEventListener(id==='feeKeyword'?'input':'change',renderFees)});
resetFeeUse();view(isAdmin?'admin':'notices');loadPublic().catch(function(e){showMsg('msg','자료를 불러오지 못했습니다: '+e.message,'bad')});
</script>
</body>
</html>
