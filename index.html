  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f7;color:#152033}*{box-sizing:border-box}body{margin:0}h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,3vw,39px);line-height:1.15}h2{font-size:23px;margin-bottom:16px}h3{font-size:18px}a{color:#176b87;font-weight:850}.app{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:24px 0 48px}.topbar,.panel,.admin-only-title{background:#fff;border:1px solid #d8dee8;border-radius:8px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:22px}.year-label{margin:0 0 4px;color:#58677d;font-weight:850}.status-band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.stat{display:grid;gap:4px;min-height:76px;padding:15px;background:#fff;border:1px solid #d8dee8;border-radius:8px}.stat span,.empty,time{color:#667085}.stat span{font-size:14px;font-weight:850}.stat strong{font-size:28px}.actions,.admin-tabs,.subtabs{display:grid;gap:10px;margin-bottom:14px}.actions,.admin-tabs{grid-template-columns:repeat(4,minmax(0,1fr))}.subtabs{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:4px}button{min-height:44px;border:0;border-radius:8px;padding:10px 16px;background:#176b87;color:#fff;font:inherit;font-weight:850;cursor:pointer;white-space:nowrap}button:disabled{opacity:.7;cursor:wait}.actions button,.admin-tabs button{background:#27364a}.subtabs button,button.light{background:#e9edf3;color:#1f2a3a}.actions button.active,.admin-tabs button.active,.subtabs button.active{background:#176b87;color:#fff}button.secondary{background:#4b5565}button.danger{background:#9f2a2a}.panel{padding:20px}.admin-only-title{margin-bottom:14px;padding:18px 20px}.notice-list,.admin-list{display:grid;gap:10px}.notice,.admin-item,.admin-card{border:1px solid #e0e7ef;border-radius:8px;background:#fbfcfe;overflow:hidden}.notice-head,.admin-item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:15px 16px}.notice-body{padding:0 16px 16px;color:#344258;line-height:1.72;white-space:pre-line}.notice summary{margin:0 16px 16px;color:#176b87;font-weight:900;cursor:pointer}.notice a{display:inline-flex;margin:0 16px 16px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.filter-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:12px 0}.wide{grid-column:1/-1}label{display:grid;gap:6px;font-weight:850}input,select,textarea{width:100%;min-height:42px;border:1px solid #c7d0dd;border-radius:8px;padding:8px 10px;background:#fff;color:#182230;font:inherit}textarea{min-height:120px;resize:vertical}.agree,.checkline{display:flex;align-items:center;gap:8px;margin:4px 0 16px}.agree input,.checkline input{width:18px;min-height:18px}.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.message,.admin-message,.local-message{margin-bottom:14px;padding:12px 14px;border-radius:8px;background:#fff7d6;color:#5c4700;font-weight:850}.local-message{margin:12px 0 0}.message[data-tone=success],.local-message.success,.admin-message.success{background:#e7f7ed;color:#126233}.message[data-tone=warn],.local-message.warn,.admin-message.warn{background:#fff0e8;color:#8a3a12}.admin-box{max-width:420px;display:grid}.admin-box button{justify-self:end;margin-top:10px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.admin-card{display:grid;gap:10px;padding:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.summary span{padding:8px 12px;border:1px solid #dfe6ef;border-radius:999px;background:#f3f6fa;font-weight:850}.summary b{color:#1e63d6}.table-wrap{overflow:auto;border:1px solid #dfe6ef;border-radius:8px;background:#fff}.admin-table{width:100%;border-collapse:collapse;min-width:820px}.admin-table th,.admin-table td{border-bottom:1px solid #edf1f5;padding:12px;text-align:center;font-size:14px}.admin-table th{background:#f6f8fb;font-weight:900}.group-row td{background:#f8fafc!important;border-top:2px solid #cbd8eb;color:#102b3a;font-weight:950;text-align:left!important}.group-title{display:flex;justify-content:space-between;gap:12px;align-items:center}.group-title small{color:#526174;font-weight:850}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:54px;border-radius:999px;padding:5px 10px;font-weight:900;font-size:13px}.badge.attend{background:#dcfce7;color:#166534}.badge.absent{background:#fee2e2;color:#991b1b}.badge.pending{background:#e5e7eb;color:#374151}.badge.delegate{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}.report-paper{background:#fff;border:1px solid #d7dce5;padding:34px;min-width:760px}.report-paper h2{text-align:center;margin-bottom:28px}.report-paper h3{margin:26px 0 10px}.report-table{width:100%;border-collapse:collapse;margin-bottom:18px}.report-table th,.report-table td{border:1px solid #6f7480;padding:10px;text-align:left}.report-table th{background:#f1f3f6;text-align:center}.hidden{display:none!important}@media(max-width:760px){.topbar,.actions,.admin-tabs,.subtabs,.form-grid,.filter-grid,.status-band,.admin-grid{grid-template-columns:1fr}.topbar{display:grid}.guide-button,.admin-box button{width:100%}.notice-head,.admin-item-head,.group-title,.section-head{display:grid}.report-paper{padding:18px;min-width:680px}}

<body>
  <main class="app">
    <header id="topbar" class="topbar"><div><p id="currentYear" class="year-label">불러오는 중</p><h1 id="appName">경인교대 파주동문회</h1></div><button id="eventGuideBtn" class="guide-button" type="button">행사 안내</button></header>
    <section id="statusBand" class="status-band"><div class="stat"><span>전체 인원</span><strong id="summaryTotal">-</strong></div><div class="stat"><span>참석 인원</span><strong id="summaryAttend">-</strong></div><div class="stat"><span>불참 인원</span><strong id="summaryAbsent">-</strong></div></section>
    <nav id="mainActions" class="actions"><button data-view="notices" type="button">공지사항</button><button data-view="register" type="button">회원 등록</button><button data-view="attendance" type="button">행사 참석</button><button data-view="admin" type="button">관리자</button></nav>
    <section id="adminOnlyTitle" class="admin-only-title hidden"><p class="year-label">관리자 전용</p><h1>동문회 관리</h1></section>
    <section id="message" class="message hidden"></section><section id="noticesView" class="panel"></section>
    <section id="registerView" class="panel hidden"><h2>회원 등록</h2><div class="form-grid"><label>이름<input id="regName" autocomplete="name"></label><label>학번<input id="regStudentNo" inputmode="numeric"></label><label>직위<select id="regPosition"><option value="">선택</option><option>교사</option><option>교감</option><option>교장</option><option>늘봄실장</option><option>장학사</option><option>장학관</option><option>기타</option></select></label><label>현재 학교<input id="regSchool" list="schoolOptions"></label><label class="wide">연락처<input id="regPhone" inputmode="tel" autocomplete="tel"></label></div><datalist id="schoolOptions"></datalist><label class="agree"><input id="regAgree" type="checkbox"> 개인정보 수집 및 이용에 동의합니다.</label><button id="registerBtn" type="button">등록하기</button><div id="registerMsg" class="local-message hidden"></div></section>
    <section id="attendanceView" class="panel hidden"><h2>행사 참석</h2><div id="eventBox"></div></section>
    <section id="adminView" class="panel hidden"><h2>관리자 로그인</h2><div id="adminLoginBox" class="admin-box"><label>관리자 PIN<input id="adminPin" type="password" autocomplete="current-password"></label><button id="adminLoginBtn" type="button">로그인</button></div><div id="adminMsg" class="admin-message hidden"></div><div id="adminPanel" class="hidden"><nav class="admin-tabs"><button data-admin-panel="members" type="button">명단</button><button data-admin-panel="notices" type="button">공지사항</button><button data-admin-panel="fees" type="button">회비</button><button data-admin-panel="events" type="button">행사</button></nav>
      <section id="membersPanel"><div class="section-head"><div><h3>회원명단</h3><div id="memberSummary" class="summary" style="margin-top:8px"></div></div><button type="button" onclick="loadAdminData()">명단 새로고침</button></div><div class="filter-grid"><select id="memberSchool" onchange="renderMembers()"><option value="">전체 학교</option></select><select id="memberPosition" onchange="renderMembers()"><option value="">전체 직위</option></select><select id="memberGeneration" onchange="renderMembers()"><option value="">전체 기수</option></select><select id="memberSort" onchange="renderMembers()"><option value="school">학교/직위/이름순</option><option value="generationAsc">기수 오름차순</option><option value="generationDesc">기수 내림차순</option></select><input id="memberKeyword" placeholder="이름 / 학번 / 전화번호 검색" oninput="renderMembers()"></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>직위</th><th>성명</th><th>기수</th><th>학번</th><th>전화번호</th><th>대의원</th></tr></thead><tbody id="memberTableBody"></tbody></table></div></section>
      <section id="noticesPanel" class="hidden"><h3>공지사항 관리</h3><div class="admin-grid"><section class="admin-card"><input id="noticeId" type="hidden"><label>제목<input id="noticeTitle"></label><label>내용<textarea id="noticeContent"></textarea></label><label>첨부파일 이름<input id="noticeFileName"></label><label>첨부파일 주소<input id="noticeFileUrl" placeholder="https://..."></label><label class="checkline"><input id="noticePublic" type="checkbox" checked> 공개</label><label class="checkline"><input id="noticeImportant" type="checkbox"> 중요</label><div class="row-actions"><button id="saveNoticeBtn" type="button">공지 저장</button><button id="resetNoticeBtn" type="button" class="light">새 공지</button></div></section><section><h3>공지 목록</h3><div id="adminNoticeList" class="admin-list"></div></section></div></section>
      <section id="feesPanel" class="hidden"><h3>회비 관리</h3><nav class="subtabs"><button data-fee-panel="feePay" type="button">회비납부</button><button data-fee-panel="feeUse" type="button">사용</button><button data-fee-panel="settlement" type="button">결산</button></nav><section id="feePayPanel"><div id="feeSummary" class="summary"></div><div class="filter-grid"><select id="feeFilterPaid" onchange="renderFees()"><option value="">전체 납부상태</option><option value="paid">납부</option><option value="unpaid">미납</option></select><select id="feeFilterPosition" onchange="renderFees()"><option value="">전체 직위</option></select><select id="feeFilterGeneration" onchange="renderFees()"><option value="">전체 기수</option></select><input id="feeKeyword" placeholder="이름 / 학교 / 기수 검색" oninput="renderFees()"></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>성명</th><th>기수</th><th>직위</th><th>학교</th><th>회비</th><th>납부</th><th>납부일</th></tr></thead><tbody id="feeTableBody"></tbody></table></div></section><section id="feeUsePanel" class="hidden"><div class="admin-card"><input id="feeUseId" type="hidden"><div class="form-grid"><label>날짜<input id="feeUseDate" type="date"></label><label>관<select id="feeUseCategory"><option value="수입">수입</option><option value="운영비">운영비</option><option value="행사비">행사비</option></select></label><label>항<select id="feeUseSubcategory"></select></label><label id="feeUseSubcategoryCustomWrap" class="hidden">항 직접입력<input id="feeUseSubcategoryCustom" placeholder="항 입력"></label><label>목<input id="feeUseItem" placeholder="예: 식대"></label><label>수입<input id="feeUseIncome" type="number" value="0"></label><label>지출<input id="feeUseExpense" type="number" value="0"></label><label class="wide">비고<input id="feeUseNote"></label></div><div class="row-actions"><button id="saveFeeUseBtn" type="button">사용내역 저장</button><button id="resetFeeUseBtn" type="button" class="light">새로쓰기</button></div></div><div class="table-wrap" style="margin-top:12px"><table class="admin-table"><thead><tr><th>날짜</th><th>관</th><th>항</th><th>목</th><th>수입</th><th>지출</th><th>비고</th><th>관리</th></tr></thead><tbody id="feeUseTableBody"></tbody></table></div></section><section id="settlementPanel" class="hidden"><div class="section-head"><h3>결산보고서</h3><div class="row-actions"><button id="printSettlementBtn" type="button">PDF로 저장</button><button id="excelSettlementBtn" type="button" class="light">엑셀로 저장</button></div></div><div id="settlementSummary" class="summary"></div><div class="table-wrap"><div id="settlementPreview" class="report-paper"></div></div></section></section>
      <section id="eventsPanel" class="hidden"><h3>행사 관리</h3><nav class="subtabs"><button data-event-panel="eventManage" type="button">행사관리</button><button data-event-panel="eventGuide" type="button">안내</button><button data-event-panel="attendanceAdmin" type="button">참석현황</button></nav><section id="eventManagePanel"><div class="admin-grid"><section class="admin-card"><input id="eventId" type="hidden"><label>행사명<input id="eventTitle"></label><label>날짜<input id="eventDate" type="date"></label><label>장소<input id="eventPlace"></label><label>내용<textarea id="eventContent"></textarea></label><label>행사안내 PDF 이름<input id="eventPdfName"></label><label>행사안내 PDF 주소<input id="eventPdfUrl" placeholder="https://..."></label><label class="checkline"><input id="eventActive" type="checkbox" checked> 현재 행사로 사용</label><div class="row-actions"><button id="saveEventBtn" type="button">행사 저장</button><button id="clearEventPdfBtn" type="button" class="secondary">PDF 삭제</button><button id="resetEventBtn" type="button" class="light">새 행사</button></div></section><section><h3>행사 목록</h3><div id="adminEventList" class="admin-list"></div></section></div></section><section id="eventGuidePanel" class="hidden"><div id="eventGuideList" class="admin-list"></div></section><section id="attendanceAdminPanel" class="hidden"><h3 id="attendanceEventTitle">참석현황</h3><div id="attendanceAdminSummary" class="summary" style="margin-top:8px"></div><div class="filter-grid"><select id="attendanceStatusFilter" onchange="renderAttendanceAdmin()"><option value="">전체 참석여부</option><option value="참석">참석</option><option value="불참">불참</option><option value="미응답">미응답</option></select><select id="attendanceSchoolFilter" onchange="renderAttendanceAdmin()"><option value="">전체 학교</option></select><select id="attendancePositionFilter" onchange="renderAttendanceAdmin()"><option value="">전체 직위</option></select><select id="attendanceGroupBy" onchange="renderAttendanceAdmin()"><option value="school">학교별 묶기</option><option value="position">직위별 묶기</option><option value="none">묶지 않기</option></select><input id="attendanceKeyword" placeholder="이름 / 학교 / 기수 검색" oninput="renderAttendanceAdmin()"></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>기수</th><th>이름</th><th>학교</th><th>직위</th><th>참석여부</th><th>수정일</th></tr></thead><tbody id="attendanceAdminBody"></tbody></table></div></section></section>
    </div></section>
  </main>
<script>
const isAdminOnly=new URLSearchParams(location.search).get('admin')==='1';const db=window.supabase.createClient('https://lemwzcchuazqpsyzsoff.supabase.co','sb_publishable_dXOuhuPizNsQgCXtqQYY4A_DBk6WCGV');const state={settings:{},notices:[],events:[],schools:[],attendanceSummary:null,activeEvent:null,adminPin:'',adminNotices:[],adminEvents:[],adminMembers:[],feeSummary:{},feeUses:[],settlement:{},attendanceAdmin:{},attendanceList:[]};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');const money=v=>Number(v||0).toLocaleString();const koDate=v=>{if(!v)return'';const d=new Date(String(v).includes('T')?v:`${v}T00:00:00`);return isNaN(d.getTime())?String(v):d.toLocaleDateString('ko-KR')};function showMessage(t,tone='info'){const e=$('message');if(!t){e.classList.add('hidden');e.textContent='';return}e.textContent=t;e.dataset.tone=tone;e.classList.remove('hidden')}function setRegisterMsg(t,tone='success'){const e=$('registerMsg');if(!t){e.className='local-message hidden';e.textContent='';return}e.textContent=t;e.className=`local-message ${tone}`}function showAdminMsg(t,tone='success'){const e=$('adminMsg');e.textContent=t;e.className=`admin-message ${tone}`}function adminUrl(){const u=new URL(location.href);u.searchParams.set('admin','1');return u.toString()}function openAdminWindow(){window.open(adminUrl(),'_blank','noopener')}function switchView(n){if(n==='admin'&&!isAdminOnly){openAdminWindow();return}['notices','register','attendance','admin'].forEach(v=>$(`${v}View`).classList.toggle('hidden',v!==n));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===n));if(n==='register')setRegisterMsg('')}function setupAdminOnly(){if(!isAdminOnly)return;$('topbar').classList.add('hidden');$('statusBand').classList.add('hidden');$('mainActions').classList.add('hidden');$('adminOnlyTitle').classList.remove('hidden' }명 · 참석 ${attend}명 · 불참 ${absent}명 · 미응답 ${pending}명</small></div></td></tr>`;last=group}html+=`<tr><td>${esc(a.generation||'')}기</td><td>${esc(a.name||'')}</td><td>${esc(a.school||'')}</td><td>${esc(a.position||'')}</td><td>${attendanceBadge(a.status)}</td><td>${esc(koDate(a.updated_at))}</td></tr>`});$('attendanceAdminBody').innerHTML=html}function renderNoticeList(){$('adminNoticeList').innerHTML=state.adminNotices.map(n=>`<article class="admin-item"><div class="admin-item-head"><strong>${esc(n.title||'')}</strong><small>${n.is_public?'공개':'비공개'}</small></div><div class="row-actions" style="padding:0 16px 14px"><button type="button" class="light" data-edit-notice="${n.id}">수정</button><button type="button" class="secondary" data-delete-notice="${n.id}">삭제</button></div></article>`).join('')||'<p class="empty">공지사항이 없습니다.</p>';document.querySelectorAll('[data-edit-notice]').forEach(b=>b.addEventListener('click',()=>fillNotice(b.dataset.editNotice)));document.querySelectorAll('[data-delete-notice]').forEach(b=>b.addEventListener('click',()=>deleteNotice(b.dataset.deleteNotice)))}function fillNotice(id){const n=state.adminNotices.find(x=>x.id===id);if(!n)return;$('noticeId').value=n.id;$('noticeTitle').value=n.title||'';$('noticeContent').value=n.content||'';$('noticeFileName').value=n.file_name||'';$('noticeFileUrl').value=n.file_url||'';$('noticePublic').checked=!!n.is_public;$('noticeImportant').checked=!!n.important}function resetNotice(){['noticeId','noticeTitle','noticeContent','noticeFileName','noticeFileUrl'].forEach(id=>$(id).value='');$('noticePublic').checked=true;$('noticeImportant').checked=false}async function saveNotice(){const p={p_pin:state.adminPin,p_id:$('noticeId').value||null,p_title:$('noticeTitle').value,p_content:$('noticeContent').value,p_file_url:$('noticeFileUrl').value,p_file_name:$('noticeFileName').value,p_is_public:$('noticePublic').checked,p_important:$('noticeImportant').checked};const{error}=await db.rpc('admin_save_notice',p);if(error){showAdminMsg(error.message,'warn');return}resetNotice();await loadAdminData();await loadApp();showAdminMsg('공지사항을 저장했습니다.','success')}async function deleteNotice(id){if(!confirm('공지사항을 삭제할까요?'))return;const{error}=await db.rpc('admin_delete_notice',{p_pin:state.adminPin,p_id:id});if(error){showAdminMsg(error.message,'warn');return}await loadAdminData();await loadApp();showAdminMsg('공지사항을 삭제했습니다.','success')}function renderEventList(){$('adminEventList').innerHTML=state.adminEvents.map(e=>`<article class="admin-item"><div class="admin-item-head"><strong>${esc(e.title||'')}</strong><small>${e.active?'현재 행사':'비활성'}</small></div><div class="row-actions" style="padding:0 16px 14px"><button type="button" class="light" data-edit-event="${e.id}">수정</button></div></article>`).join('')||'<p class="empty">행사가 없습니다.</p>';document.querySelectorAll('[data-edit-event]').forEach(b=>b.addEventListener('click',()=>fillEvent(b.dataset.editEvent)))}function renderEventGuideList(){$('eventGuideList').innerHTML=state.adminEvents.map(e=>`<article class="admin-item"><div class="admin-item-head"><strong>${esc(e.title||'')}</strong><small>${e.pdf_file_url?'안내 있음':'안내 없음'}</small></div><div style="padding:0 16px 14px">${e.pdf_file_url?`<a href="${esc(e.pdf_file_url)}" target="_blank">${esc(e.pdf_file_name||'PDF 보기')}</a>`:'<p class="empty">행사안내 PDF가 없습니다.</p>'}<div class="row-actions" style="margin-top:10px"><button class="light" onclick="fillEvent('${e.id}');showEventPanel('eventManage')">수정</button></div></div></article>`).join('')||'<p class="empty">행사가 없습니다.</p>'}function fillEvent(id){const e=state.adminEvents.find(x=>x.id===id);if(!e)return;$('eventId').value=e.id;$('eventTitle').value=e.title||'';$('eventDate').value=e.event_date||'';$('eventPlace').value=e.place||'';$('eventContent').value=e.content||'';$('eventPdfName').value=e.pdf_file_name||'';$('eventPdfUrl').value=e.pdf_file_url||'';$('eventActive').checked=!!e.active}function resetEvent(){['eventId','eventTitle','eventDate','eventPlace','eventContent','eventPdfName','eventPdfUrl'].forEach(id=>$(id).value='');$('eventActive').checked=true}async function saveEvent(){const p={p_pin:state.adminPin,p_id:$('eventId').value||null,p_title:$('eventTitle').value,p_event_date:$('eventDate').value||null,p_place:$('eventPlace').value,p_content:$('eventContent').value,p_pdf_file_url:$('eventPdfUrl').value,p_pdf_file_name:$('eventPdfName').value,p_active:$('eventActive').checked};const{error}=await db.rpc('admin_save_event',p);if(error){showAdminMsg(error.message,'warn');return}await loadAdminData();await loadApp();showAdminMsg('행사를 저장했습니다.','success')}async function clearEventPdf(){const id=$('eventId').value;if(!id){showAdminMsg('먼저 행사를 선택해 주세요.','warn');return}if(!confirm('행사안내 PDF를 삭제할까요?'))return;const{error}=await db.rpc('admin_delete_event_guide',{p_pin:state.adminPin,p_event_id:id});if(error){showAdminMsg(error.message,'warn');return}$('eventPdfName').value='';$('eventPdfUrl').value='';await loadAdminData();await loadApp();showAdminMsg('행사안내 PDF를 삭제했습니다.','success')}async function updateFee(id,paid,amount){const{error}=await db.rpc('admin_update_fee_status',{p_pin:state.adminPin,p_member_id:id,p_paid:paid,p_paid_date:paid?new Date().toISOString().slice(0,10):null,p_amount:Number(amount||0),p_note:''});if(error){showAdminMsg(error.message,'warn');return}await loadAdminData();showAdminMsg(paid?'납부 처리되었습니다.':'미납 처리되었습니다.','success')}async function toggleDelegate(id,next){const{error}=await db.rpc('admin_update_delegate',{p_pin:state.adminPin,p_member_id:id,p_delegate:next});if(error){showAdminMsg(error.message,'warn');return}await loadAdminData();showAdminMsg('대의원 상태를 변경했습니다.','success')}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));document.querySelectorAll('[data-admin-panel]').forEach(b=>b.addEventListener('click',()=>showAdminPanel(b.dataset.adminPanel)));document.querySelectorAll('[data-fee-panel]').forEach(b=>b.addEventListener('click',()=>showFeePanel(b.dataset.feePanel)));document.querySelectorAll('[data-event-panel]').forEach(b=>b.addEventListener('click',()=>showEventPanel(b.dataset.eventPanel)));$('eventGuideBtn').addEventListener('click',openEventGuide);$('registerBtn').addEventListener('click',registerMember);$('adminLoginBtn').addEventListener('click',adminLogin);$('adminPin').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});$('saveNoticeBtn').addEventListener('click',saveNotice);$('resetNoticeBtn').addEventListener('click',resetNotice);$('saveEventBtn').addEventListener('click',saveEvent);$('resetEventBtn').addEventListener('click',resetEvent);$('clearEventPdfBtn').addEventListener('click',clearEventPdf);$('saveFeeUseBtn').addEventListener('click',saveFeeUse);$('resetFeeUseBtn').addEventListener('click',resetFeeUse);$('feeUseCategory').addEventListener('change',()=>updateFeeUseSubcategoryOptions());$('feeUseSubcategory').addEventListener('change',toggleFeeUseCustom);$('printSettlementBtn').addEventListener('click',printSettlement);$('excelSettlementBtn').addEventListener('click',downloadSettlementExcel);resetFeeUse();setupAdminOnly();switchView(isAdminOnly?'admin':'notices');loadApp().catch(e=>{console.error(e);showMessage('자료를 불러오지 못했습니다. Supabase 설정을 확인해 주세요.','warn')});
