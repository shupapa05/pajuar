<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>경인교대 파주동문회</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{min-height:42px;border:0;border-radius:8px;padding:9px 14px;background:#176b87;color:#fff;font-weight:800;cursor:pointer}.light{background:#e9edf3;color:#172033}.dark{background:#27364a}.danger{background:#9f2a2a}.app{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:24px 0 48px}.card,.hero{background:#fff;border:1px solid #d8dee8;border-radius:8px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:22px}.hero h1{margin:0;font-size:34px}.muted{color:#667085;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{padding:14px;background:#fff;border:1px solid #d8dee8;border-radius:8px}.stat span{display:block;color:#667085;font-weight:800}.stat b{font-size:28px}.tabs,.subtabs{display:grid;gap:10px;margin:14px 0}.tabs{grid-template-columns:repeat(4,1fr)}.subtabs{grid-template-columns:repeat(3,1fr)}.tabs button,.subtabs button{background:#27364a}.active{background:#176b87!important}.card{padding:20px;margin-top:14px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.wide{grid-column:1/-1}label{display:grid;gap:6px;font-weight:800}input,select,textarea{width:100%;min-height:42px;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;background:#fff}textarea{min-height:110px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.msg{margin:12px 0;padding:11px 13px;border-radius:8px;background:#fff4d8;color:#7a4b00;font-weight:800}.ok{background:#e7f7ed!important;color:#126233!important}.bad{background:#fee2e2!important;color:#991b1b!important}.notice,.item{border:1px solid #e2e8f0;border-radius:8px;background:#fbfcfe;margin-bottom:10px;padding:15px}.notice p{white-space:pre-line;line-height:1.7}.table-wrap{overflow:auto;border:1px solid #dfe6ef;border-radius:8px;background:#fff}.tbl{width:100%;border-collapse:collapse;min-width:850px}.tbl th,.tbl td{border-bottom:1px solid #edf1f5;padding:11px;text-align:center;font-size:14px}.tbl th{background:#f6f8fb}.group td{background:#f8fafc!important;border-top:2px solid #cbd8eb;text-align:left!important;font-weight:900}.group-title{display:flex;justify-content:space-between;gap:12px}.pill{display:inline-flex;border-radius:999px;padding:5px 10px;font-weight:900;font-size:13px}.attend{background:#dcfce7;color:#166534}.absent{background:#fee2e2;color:#991b1b}.pending{background:#e5e7eb;color:#374151}.delegate{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}.admin-title{display:none}.admin-only .hero,.admin-only #stats,.admin-only #mainTabs{display:none}.admin-only .admin-title{display:block}@media(max-width:780px){.hero,.grid,.filters,.stats,.tabs,.subtabs{display:grid;grid-template-columns:1fr}.hero button{width:100%}}
</style>
</head>
<body>
<main class="app">
<section class="hero"><div><div id="year" class="muted">불러오는 중</div><h1 id="name">경인교대 파주동문회</h1></div><button id="guideBtn">행사 안내</button></section>
<section class="admin-title card"><div class="muted">관리자 전용</div><h1>동문회 관리</h1></section>
<section id="stats" class="stats"><div class="stat"><span>전체</span><b id="stTotal">-</b></div><div class="stat"><span>참석</span><b id="stAttend">-</b></div><div class="stat"><span>불참</span><b id="stAbsent">-</b></div><div class="stat"><span>미응답</span><b id="stPending">-</b></div></section>
<nav id="mainTabs" class="tabs"><button data-view="notices">공지사항</button><button data-view="register">회원 등록</button><button data-view="attendance">행사 참석</button><button data-view="admin">관리자</button></nav>
<div id="msg" class="msg hidden"></div>
<section id="noticesView" class="card"></section>
<section id="registerView" class="card hidden"><h2>회원 등록</h2><div class="grid"><label>이름<input id="regName"></label><label>학번<input id="regStudentNo" inputmode="numeric" placeholder="예: 90"></label><label>직위<select id="regPosition"><option value="">선택</option><option>교사</option><option>교감</option><option>교장</option><option>늘봄실장</option><option>장학사</option><option>장학관</option><option>기타</option></select></label><label>현재 학교<input id="regSchool" list="schoolList"></label><label class="wide">연락처<input id="regPhone" inputmode="tel" placeholder="예: 010-0000-0000"></label></div><datalist id="schoolList"></datalist><label class="row" style="margin:12px 0"><input id="regAgree" type="checkbox" style="width:18px;min-height:18px"> 개인정보 수집 및 이용에 동의합니다.</label><button id="registerBtn">등록하기</button><div id="registerMsg" class="msg hidden"></div></section>
<section id="attendanceView" class="card hidden"><h2>행사 참석</h2><div id="eventBox" class="notice"></div><div class="grid"><label>이름<input id="attName"></label><label>동명이인 확인<input id="attSchool" list="schoolList" placeholder="필요할 때 학교명 입력"></label></div><div class="row" style="margin-top:12px"><button data-att="참석" class="dark">참석</button><button data-att="불참" class="dark">불참</button><button id="attSave">저장하기</button></div><div id="attMsg" class="msg hidden"></div></section>
<section id="adminView" class="card hidden"><div id="loginBox"><h2>관리자 로그인</h2><label>관리자 PIN<input id="adminPin" type="password"></label><div class="row" style="justify-content:flex-end;margin-top:10px"><button id="loginBtn">로그인</button></div></div><div id="adminMsg" class="msg hidden"></div><div id="adminPanel" class="hidden"><nav class="tabs"><button data-admin="members">명단</button><button data-admin="notices">공지사항</button><button data-admin="fees">회비</button><button data-admin="events">행사</button></nav><section id="membersPanel"><div class="row" style="justify-content:space-between"><h2>회원명단</h2><button id="refreshBtn">새로고침</button></div><div id="memberSummary" class="row"></div><div class="filters"><select id="mSchool"></select><select id="mPosition"></select><select id="mGeneration"></select><select id="mSort"><option value="school">학교/직위/이름순</option><option value="genA">기수 오름차순</option><option value="genD">기수 내림차순</option></select><input id="mKeyword" placeholder="이름 / 학번 / 전화번호 검색"></div><div class="table-wrap"><table class="tbl"><thead><tr id="memberHead"></tr></thead><tbody id="memberBody"></tbody></table></div></section><section id="noticesPanel" class="hidden"><h2>공지사항 관리</h2><div class="grid"><div class="item"><input id="nId" type="hidden"><label>제목<input id="nTitle"></label><label>내용<textarea id="nContent"></textarea></label><label>첨부파일명<input id="nFileName"></label><label>첨부파일 주소<input id="nFileUrl" placeholder="https://..."></label><label class="row"><input id="nPublic" type="checkbox" checked style="width:18px;min-height:18px"> 공개</label><label class="row"><input id="nImportant" type="checkbox" style="width:18px;min-height:18px"> 중요</label><div class="row"><button id="saveNotice">공지 저장</button><button id="resetNotice" class="light">새 공지</button></div></div><div id="noticeAdminList"></div></div></section><section id="feesPanel" class="hidden"><h2>회비 관리</h2><nav class="subtabs"><button data-fee="pay">회비납부</button><button data-fee="use">사용</button><button data-fee="report">결산</button></nav><section id="feePay"><div id="feeSummary" class="row"></div><div class="filters"><select id="fPaid"></select><select id="fPos"></select><select id="fGen"></select><input id="fKeyword" placeholder="이름 / 학교 / 기수 검색"></div><div class="table-wrap"><table class="tbl"><thead><tr><th>성명</th><th>기수</th><th>직위</th><th>학교</th><th>회비</th><th>납부</th><th>납부일</th></tr></thead><tbody id="feeBody"></tbody></table></div></section><section id="feeUse" class="hidden"><div class="item"><input id="uId" type="hidden"><div class="grid"><label>날짜<input id="uDate" type="date"></label><label>관<select id="uCat"><option>수입</option><option>운영비</option><option>행사비</option></select></label><label>항<select id="uSub"></select></label><label id="uCustomWrap" class="hidden">항 직접입력<input id="uCustom"></label><label>목<input id="uItem"></label><label>수입<input id="uIncome" type="number" value="0"></label><label>지출<input id="uExpense" type="number" value="0"></label><label class="wide">비고<input id="uNote"></label></div><div class="row"><button id="saveUse">사용내역 저장</button><button id="resetUse" class="light">새로쓰기</button></div></div><div class="table-wrap"><table class="tbl"><thead><tr><th>날짜</th><th>관</th><th>항</th><th>목</th><th>수입</th><th>지출</th><th>비고</th><th>관리</th></tr></thead><tbody id="useBody"></tbody></table></div></section><section id="feeReport" class="hidden"><h2>결산보고서</h2><div id="reportBox" class="notice"></div></section></section><section id="eventsPanel" class="hidden"><h2>행사 관리</h2><nav class="subtabs"><button data-event="manage">행사관리</button><button data-event="guide">안내</button><button data-event="attend">참석현황</button></nav><section id="eventManage"><div class="grid"><div class="item"><input id="eId" type="hidden"><label>행사명<input id="eTitle"></label><label>행사일<input id="eDate" type="date"></label><label>장소<input id="ePlace"></label><label>내용<textarea id="eContent"></textarea></label><label>행사안내 PDF 이름<input id="ePdfName"></label><label>행사안내 PDF 주소<input id="ePdfUrl" placeholder="https://..."></label><label class="row"><input id="eActive" type="checkbox" checked style="width:18px;min-height:18px"> 현재 행사로 사용</label><div class="row"><button id="saveEvent">행사 저장</button><button id="deleteGuide" class="dark">PDF 삭제</button><button id="resetEvent" class="light">새 행사</button></div></div><div id="eventAdminList"></div></div></section><section id="eventGuide" class="hidden"><div id="eventGuideList"></div></section><section id="eventAttend" class="hidden"><h2 id="attTitle">참석현황</h2><div id="attSummary" class="row"></div><div class="filters"><select id="aStatus"></select><select id="aSchool"></select><select id="aPos"></select><select id="aGroup"><option value="school">학교별 묶기</option><option value="position">직위별 묶기</option><option value="none">묶지 않기</option></select><input id="aKeyword" placeholder="이름 / 학교 / 기수 검색"></div><div class="table-wrap"><table class="tbl"><thead><tr><th>기수</th><th>이름</th><th>학교</th><th>직위</th><th>참석여부</th><th>수정일</th></tr></thead><tbody id="attBody"></tbody></table></div></section></section></div></section>
</main>
<script>
const db=supabase.createClient('https://lemwzcchuazqpsyzsoff.supabase.co','sb_publishable_dXOuhuPizNsQgCXtqQYY4A_DBk6WCGV');
const S={settings:{},notices:[],events:[],schools:[],summary:{},attChoice:'',pin:'',isMain:false,members:[],adminNotices:[],adminEvents:[],feeUses:[],feeSummary:{},attList:[]};
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=v=>Number(v||0).toLocaleString();
const date=v=>{if(!v)return'';const d=new Date(String(v).includes('T')?v:String(v)+'T00:00:00');return isNaN(d)?String(v):d.toLocaleDateString('ko-KR')};
const isAdmin=new URLSearchParams(location.search).get('admin')==='1'; if(isAdmin)document.body.classList.add('admin-only');
function showMsg(id,t,cls=''){const e=$(id);if(!t){e.className='msg hidden';e.textContent='';return}e.className='msg '+cls;e.textContent=t}
async function rpc(n,a={}){const r=await db.rpc(n,a);if(r.error)throw r.error;return r.data}
function fill(id,label,items){$(id).innerHTML='<option value="">'+label+'</option>'+items.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')}
function ev(){return S.events.find(e=>e.id===S.summary.event_id)||S.events.find(e=>e.active)||S.events[0]||null}
async function loadPublic(){const d=await rpc('get_public_alumni_app_data');S.settings=d.settings||{};S.notices=d.notices||[];S.events=d.events||[];S.schools=(d.schools||[]).map(x=>x.name||x);S.summary=d.attendance_summary||{};renderPublic()}
function renderPublic(){$('name').textContent=S.settings.alumni_name||'경인교대 파주동문회';$('year').textContent=(S.settings.current_year||new Date().getFullYear())+'년도';$('stTotal').textContent=S.summary.total??'-';$('stAttend').textContent=S.summary.attend??'-';$('stAbsent').textContent=S.summary.absent??'-';$('stPending').textContent=S.summary.pending??'-';$('schoolList').innerHTML=S.schools.map(s=>'<option value="'+esc(s)+'"></option>').join('');renderNotices();renderEventBox()}
function view(v){if(v==='admin'&&!isAdmin){window.open(location.pathname+'?admin=1','_blank','noopener');return}['notices','register','attendance','admin'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
function renderNotices(){$('noticesView').innerHTML='<h2>공지사항</h2>'+(S.notices.length?S.notices.map(n=>'<article class="notice"><h3>'+esc(n.title)+'</h3><div class="muted">'+date(n.created_at)+'</div><p>'+esc(n.content||'')+'</p>'+(n.file_url?'<a target="_blank" href="'+esc(n.file_url)+'">첨부파일 보기'+(n.file_name?': '+esc(n.file_name):'')+'</a>':'')+'</article>').join(''):'<p>등록된 공지가 없습니다.</p>')}
function renderEventBox(){const e=ev();$('eventBox').innerHTML=e?'<h3>'+esc(e.title)+'</h3><p>'+date(e.event_date)+(e.place?' · '+esc(e.place):'')+'</p><p>'+esc(e.content||'')+'</p>':'<p>현재 등록된 행사가 없습니다.</p>'}
async function guide(){const e=ev();if(!e||!e.pdf_file_url){alert('행사안내가 없습니다.');return}window.open(e.pdf_file_url,'_blank')}
async function register(){try{showMsg('registerMsg','등록 중입니다...');const d=await rpc('register_alumni_member',{p_name:$('regName').value,p_student_no:$('regStudentNo').value,p_position:$('regPosition').value,p_school:$('regSchool').value,p_phone:$('regPhone').value,p_privacy_agreed:$('regAgree').checked});showMsg('registerMsg',(d&&d.message)||'등록되었습니다.','ok');['regName','regStudentNo','regPhone','regSchool'].forEach(id=>$(id).value='');$('regPosition').value='';$('regAgree').checked=false}catch(e){showMsg('registerMsg',e.message,'bad')}}
async function saveAtt(){try{const e=ev();if(!e)throw Error('현재 등록된 행사가 없습니다.');if(!S.attChoice)throw Error('참석 또는 불참을 선택해주세요.');showMsg('attMsg','저장 중입니다...');const d=await rpc('submit_event_attendance',{p_event_id:e.id,p_name:$('attName').value,p_school:$('attSchool').value,p_status:S.attChoice});showMsg('attMsg',(d&&d.message)||'저장되었습니다.','ok')}catch(e){showMsg('attMsg',e.message,'bad')}}
async function login(){try{S.pin=$('adminPin').value.trim();showMsg('adminMsg','관리자 화면을 불러오는 중입니다...');await loadAdmin();$('loginBox').classList.add('hidden');$('adminPanel').classList.remove('hidden');showMsg('adminMsg',S.isMain?'메인관리자로 로그인했습니다.':'일반관리자로 로그인했습니다.','ok');adminPanel('members')}catch(e){showMsg('adminMsg',e.message||'PIN을 확인해주세요.','bad')}}
async function loadAdmin(){const d=await rpc('get_admin_alumni_app_data',{p_pin:S.pin});S.isMain=!!d.is_main_admin;S.members=d.members||[];S.adminNotices=d.notices||[];S.adminEvents=d.events||[];S.feeUses=d.fee_uses||[];S.feeSummary=d.fee_summary||{};S.attList=d.attendance_list||[];renderAdmin()}
function adminPanel(p){['members','notices','fees','events'].forEach(x=>$(x+'Panel').classList.toggle('hidden',x!==p));document.querySelectorAll('[data-admin]').forEach(b=>b.classList.toggle('active',b.dataset.admin===p));if(p==='fees')feePanel('pay');if(p==='events')eventPanel('manage')}
function feePanel(p){$('feePay').classList.toggle('hidden',p!=='pay');$('feeUse').classList.toggle('hidden',p!=='use');$('feeReport').classList.toggle('hidden',p!=='report');document.querySelectorAll('[data-fee]').forEach(b=>b.classList.toggle('active',b.dataset.fee===p));if(p==='report')renderReport()}
function eventPanel(p){$('eventManage').classList.toggle('hidden',p!=='manage');$('eventGuide').classList.toggle('hidden',p!=='guide');$('eventAttend').classList.toggle('hidden',p!=='attend');document.querySelectorAll('[data-event]').forEach(b=>b.classList.toggle('active',b.dataset.event===p));if(p==='attend')renderAttAdmin()}
function posRank(p){return ['교장','교감','장학관','장학사','교사','늘봄실장'].indexOf(String(p||''))}
function renderAdmin(){fill('mSchool','전체 학교',[...new Set(S.members.map(m=>m.school).filter(Boolean))].sort());fill('mPosition','전체 직위',[...new Set(S.members.map(m=>m.position).filter(Boolean))].sort());fill('mGeneration','전체 기수',[...new Set(S.members.map(m=>String(m.generation||'')).filter(Boolean))].sort((a,b)=>a-b));fill('fPaid','전체 납부상태',['납부','미납']);fill('fPos','전체 직위',[...new Set(S.members.map(m=>m.position).filter(Boolean))].sort());fill('fGen','전체 기수',[...new Set(S.members.map(m=>String(m.generation||'')).filter(Boolean))].sort((a,b)=>a-b));renderMembers();renderNoticeAdmin();renderFees();renderUseOptions();renderUses();renderEvents();renderAttOptions();renderAttAdmin()}
function membersFiltered(){let l=[...S.members],sc=$('mSchool').value,po=$('mPosition').value,ge=$('mGeneration').value,kw=$('mKeyword').value.toLowerCase(),so=$('mSort').value;if(sc)l=l.filter(m=>m.school===sc);if(po)l=l.filter(m=>m.position===po);if(ge)l=l.filter(m=>String(m.generation||'')===ge);if(kw)l=l.filter(m=>(m.name+' '+m.student_no+' '+m.phone).toLowerCase().includes(kw));l.sort((a,b)=>so==='genA'?Number(a.generation||0)-Number(b.generation||0):so==='genD'?Number(b.generation||0)-Number(a.generation||0):String(a.school||'').localeCompare(String(b.school||''),'ko')||((posRank(a.position)<0?99:posRank(a.position))-(posRank(b.position)<0?99:posRank(b.position)))||String(a.name||'').localeCompare(String(b.name||''),'ko'));return l}
function gtext(list){const m={};list.forEach(x=>m[x.position||'미입력']=(m[x.position||'미입력']||0)+1);return Object.keys(m).map(k=>esc(k)+' '+m[k]).join(' · ')}
function renderMembers(){const l=membersFiltered();$('memberSummary').innerHTML='<span class="pill pending">전체 '+l.length+'명</span><span class="pill pending">교장 '+l.filter(m=>m.position==='교장').length+'명</span><span class="pill pending">교감 '+l.filter(m=>m.position==='교감').length+'명</span><span class="pill pending">교사 '+l.filter(m=>m.position==='교사').length+'명</span>';$('memberHead').innerHTML='<th>직위</th><th>성명</th><th>기수</th><th>학번</th><th>전화번호</th><th>대의원</th>'+(S.isMain?'<th>관리</th>':'');let h='',last='';l.forEach(m=>{let sc=m.school||'학교 미입력';if(sc!==last){let group=l.filter(x=>(x.school||'학교 미입력')===sc);h+='<tr class="group"><td colspan="'+(S.isMain?7:6)+'"><div class="group-title"><span>'+esc(sc)+'</span><small>'+gtext(group)+'</small></div></td></tr>';last=sc}h+='<tr><td>'+esc(m.position)+'</td><td>'+esc(m.name)+'</td><td>'+esc(m.generation)+'기</td><td>'+esc(m.student_no)+'</td><td>'+esc(m.phone)+'</td><td>'+(m.delegate?'<span class="pill delegate">대의원</span>':'일반')+'</td>'+(S.isMain?'<td><button class="light" onclick="editMember(\''+m.member_id+'\')">수정</button> <button class="dark" onclick="hideMember(\''+m.member_id+'\')">숨김</button> <button class="danger" onclick="deleteMember(\''+m.member_id+'\')">삭제</button></td>':'')+'</tr>'});$('memberBody').innerHTML=h||'<tr><td colspan="7">회원이 없습니다.</td></tr>'}
async function editMember(id){let m=S.members.find(x=>x.member_id===id);if(!m)return;let name=prompt('이름',m.name||'');if(name===null)return;let st=prompt('학번',m.student_no||'');if(st===null)return;let po=prompt('직위',m.position||'');if(po===null)return;let sc=prompt('학교',m.school||'');if(sc===null)return;let ph=prompt('연락처',m.phone||'');if(ph===null)return;try{await rpc('admin_update_member',{p_pin:S.pin,p_member_id:id,p_name:name,p_student_no:st,p_position:po,p_school:sc,p_phone:ph});await loadAdmin();showMsg('adminMsg','회원 정보를 수정했습니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}}
async function hideMember(id){if(!confirm('이 회원을 명단에서 숨길까요?'))return;try{await rpc('admin_hide_member',{p_pin:S.pin,p_member_id:id});await loadAdmin();showMsg('adminMsg','숨김 처리했습니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}}
async function deleteMember(id){if(!confirm('이 회원을 완전히 삭제할까요?'))return;if(!confirm('정말 삭제합니다. 복구가 어렵습니다.'))return;try{await rpc('admin_delete_member',{p_pin:S.pin,p_member_id:id});await loadAdmin();showMsg('adminMsg','삭제했습니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}}
function renderNoticeAdmin(){$('noticeAdminList').innerHTML=S.adminNotices.map(n=>'<div class="item"><h3>'+esc(n.title)+'</h3><p>'+(n.is_public?'공개':'비공개')+'</p><button class="light" onclick="fillNotice(\''+n.id+'\')">수정</button> <button class="danger" onclick="deleteNotice(\''+n.id+'\')">삭제</button></div>').join('')||'<p>공지사항이 없습니다.</p>'}
function fillNotice(id){let n=S.adminNotices.find(x=>x.id===id);if(!n)return;$('nId').value=n.id;$('nTitle').value=n.title||'';$('nContent').value=n.content||'';$('nFileName').value=n.file_name||'';$('nFileUrl').value=n.file_url||'';$('nPublic').checked=!!n.is_public;$('nImportant').checked=!!n.important}
function resetNotice(){['nId','nTitle','nContent','nFileName','nFileUrl'].forEach(id=>$(id).value='');$('nPublic').checked=true;$('nImportant').checked=false}
async function saveNotice(){try{await rpc('admin_save_notice',{p_pin:S.pin,p_id:$('nId').value||null,p_title:$('nTitle').value,p_content:$('nContent').value,p_file_url:$('nFileUrl').value,p_file_name:$('nFileName').value,p_is_public:$('nPublic').checked,p_important:$('nImportant').checked});resetNotice();await loadAdmin();await loadPublic();showMsg('adminMsg','공지사항을 저장했습니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}}
async function deleteNotice(id){if(!confirm('공지사항을 삭제할까요?'))return;try{await rpc('admin_delete_notice',{p_pin:S.pin,p_id:id});await loadAdmin();await loadPublic();showMsg('adminMsg','삭제했습니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}}
function renderFees(){const s=S.feeSummary;$('feeSummary').innerHTML='<span class="pill pending">전체 '+(s.total||0)+'명</span><span class="pill attend">납부 '+(s.paid||0)+'명</span><span class="pill absent">미납 '+(s.unpaid||0)+'명</span><span class="pill pending">납부액 '+money(s.paid_amount)+'원</span>';let p=$('fPaid').value,po=$('fPos').value,ge=$('fGen').value,kw=$('fKeyword').value.toLowerCase();let l=S.members.filter(m=>(!p||(p==='납부'?m.fee_paid:!m.fee_paid))&&(!po||m.position===po)&&(!ge||String(m.generation||'')===ge)&&(!kw||(m.name+' '+m.school+' '+m.generation).toLowerCase().includes(kw)));$('feeBody').innerHTML=l.map(m=>'<tr><td>'+esc(m.name)+'</td><td>'+esc(m.generation)+'기</td><td>'+esc(m.position)+'</td><td>'+esc(m.school)+'</td><td>'+money(m.fee_amount)+'원</td><td><input type="checkbox" '+(m.fee_paid?'checked':'')+' onchange="updateFee(\''+m.member_id+'\',this.checked,'+(m.fee_amount||0)+')"></td><td>'+esc(m.fee_paid_date||'')+'</td></tr>').join('')||'<tr><td colspan="7">데이터가 없습니다.</td></tr>'}
async function updateFee(id,paid,amount){try{await rpc('admin_update_fee_status',{p_pin:S.pin,p_member_id:id,p_paid:paid,p_paid_date:paid?new Date().toISOString().slice(0,10):null,p_amount:amount||0,p_note:''});await loadAdmin();showMsg('adminMsg','회비 상태를 변경했습니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}}
const U={수입:['이월금','이자수입','금일봉','직접입력'],운영비:['화환','경조사','사무용품','운영비','직접입력'],행사비:['정기총회','학교모임','송년회','기념품','직접입력']};
function renderUseOptions(sel=''){let opts=U[$('uCat').value]||[];$('uSub').innerHTML='<option value="">항 선택</option>'+opts.map(x=>'<option>'+x+'</option>').join('');if(sel&&opts.includes(sel))$('uSub').value=sel;else if(sel){$('uSub').value='직접입력';$('uCustom').value=sel}toggleCustom()}
function toggleCustom(){$('uCustomWrap').classList.toggle('hidden',$('uSub').value!=='직접입력')}
function resetUse(){['uId','uItem','uNote','uCustom'].forEach(id=>$(id).value='');$('uDate').value=new Date().toISOString().slice(0,10);$('uCat').value='운영비';$('uIncome').value=0;$('uExpense').value=0;renderUseOptions()}
function renderUses(){$('useBody').innerHTML=S.feeUses.map(u=>'<tr><td>'+esc(u.used_on)+'</td><td>'+esc(u.category)+'</td><td>'+esc(u.subcategory)+'</td><td>'+esc(u.item)+'</td><td>'+money(u.income)+'원</td><td>'+money(u.expense)+'원</td><td>'+esc(u.note)+'</td><td><button class="danger" onclick="deleteUse(\''+u.id+'\')">삭제</button></td></tr>').join('')||'<tr><td colspan="8">사용내역이 없습니다.</td></tr>'}
async function saveUse(){try{await rpc('admin_save_fee_use',{p_pin:S.pin,p_id:$('uId').value||null,p_used_on:$('uDate').value||null,p_category:$('uCat').value,p_subcategory:$('uSub').value==='직접입력'?$('uCustom').value:$('uSub').value,p_item:$('uItem').value,p_income:Number($('uIncome').value||0),p_expense:Number($('uExpense').value||0),p_note:$('uNote').value});resetUse();await loadAdmin();showMsg('adminMsg','사용내역을 저장했습니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}}
async function deleteUse(id){if(!confirm('사용내역을 삭제할까요?'))return;try{await rpc('admin_delete_fee_use',{p_pin:S.pin,p_id:id});await loadAdmin();showMsg('adminMsg','삭제했습니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}}
function renderReport(){let paid=Number(S.feeSummary.paid_amount||0),income=paid+S.feeUses.reduce((a,u)=>a+Number(u.income||0),0),expense=S.feeUses.reduce((a,u)=>a+Number(u.expense||0),0);$('reportBox').innerHTML='<h3>'+(S.settings.current_year||'')+'년도 결산보고서</h3><p>총 수입 '+money(income)+'원</p><p>총 지출 '+money(expense)+'원</p><p>잔액 '+money(income-expense)+'원</p>'}
function renderEvents(){$('eventAdminList').innerHTML=S.adminEvents.map(e=>'<div class="item"><h3>'+esc(e.title)+'</h3><p>'+date(e.event_date)+(e.place?' · '+esc(e.place):'')+'</p><button class="light" onclick="fillEvent(\''+e.id+'\')">수정</button></div>').join('')||'<p>행사가 없습니다.</p>';$('eventGuideList').innerHTML=S.adminEvents.map(e=>'<div class="item"><h3>'+esc(e.title)+'</h3>'+(e.pdf_file_url?'<a target="_blank" href="'+esc(e.pdf_file_url)+'">'+esc(e.pdf_file_name||'PDF 보기')+'</a>':'<p>행사안내 PDF가 없습니다.</p>')+'</div>').join('')}
function fillEvent(id){let e=S.adminEvents.find(x=>x.id===id);if(!e)return;$('eId').value=e.id;$('eTitle').value=e.title||'';$('eDate').value=e.event_date||'';$('ePlace').value=e.place||'';$('eContent').value=e.content||'';$('ePdfName').value=e.pdf_file_name||'';$('ePdfUrl').value=e.pdf_file_url||'';$('eActive').checked=!!e.active}
function resetEvent(){['eId','eTitle','eDate','ePlace','eContent','ePdfName','ePdfUrl'].forEach(id=>$(id).value='');$('eActive').checked=true}
async function saveEvent(){try{await rpc('admin_save_event',{p_pin:S.pin,p_id:$('eId').value||null,p_title:$('eTitle').value,p_event_date:$('eDate').value||null,p_place:$('ePlace').value,p_content:$('eContent').value,p_pdf_file_url:$('ePdfUrl').value,p_pdf_file_name:$('ePdfName').value,p_active:$('eActive').checked});await loadAdmin();await loadPublic();showMsg('adminMsg','행사를 저장했습니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}}
async function deleteGuide(){let id=$('eId').value;if(!id){showMsg('adminMsg','먼저 행사를 선택해주세요.','bad');return}if(!confirm('행사안내 PDF를 삭제할까요?'))return;try{await rpc('admin_delete_event_guide',{p_pin:S.pin,p_event_id:id});await loadAdmin();await loadPublic();showMsg('adminMsg','PDF를 삭제했습니다.','ok')}catch(e){showMsg('adminMsg',e.message,'bad')}}
function renderAttOptions(){fill('aStatus','전체 참석여부',['참석','불참','미응답']);fill('aSchool','전체 학교',[...new Set(S.attList.map(a=>a.school||'학교 미입력'))].sort());fill('aPos','전체 직위',[...new Set(S.attList.map(a=>a.position||'직위 미입력'))].sort())}
function ast(v){return v==='참석'||v==='불참'?v:'미응답'}function badge(v){let s=ast(v);return '<span class="pill '+(s==='참석'?'attend':s==='불참'?'absent':'pending')+'">'+s+'</span>'}
function renderAttAdmin(){let st=$('aStatus')?.value||'',sc=$('aSchool')?.value||'',po=$('aPos')?.value||'',kw=($('aKeyword')?.value||'').toLowerCase(),gr=$('aGroup')?.value||'school';let l=S.attList.filter(a=>(!st||ast(a.status)===st)&&(!sc||(a.school||'학교 미입력')===sc)&&(!po||(a.position||'직위 미입력')===po)&&(!kw||(a.name+' '+a.school+' '+a.generation).toLowerCase().includes(kw))).sort((a,b)=>String(a.school||'').localeCompare(String(b.school||''),'ko')||Number(a.generation||0)-Number(b.generation||0));let at=l.filter(a=>ast(a.status)==='참석').length,ab=l.filter(a=>ast(a.status)==='불참').length;$('attSummary').innerHTML='<span class="pill pending">전체 '+l.length+'명</span><span class="pill attend">참석 '+at+'명</span><span class="pill absent">불참 '+ab+'명</span><span class="pill pending">미응답 '+(l.length-at-ab)+'명</span>';let h='',last='';l.forEach(a=>{let g=gr==='position'?(a.position||'직위 미입력'):gr==='school'?(a.school||'학교 미입력'):'';if(gr!=='none'&&g!==last){let group=l.filter(x=>(gr==='position'?(x.position||'직위 미입력'):(x.school||'학교 미입력'))===g),ga=group.filter(x=>ast(x.status)==='참석').length,gb=group.filter(x=>ast(x.status)==='불참').length;h+='<tr class="group"><td colspan="6"><div class="group-title"><span>'+esc(g)+'</span><small>전체 '+group.length+'명 · 참석 '+ga+'명 · 불참 '+gb+'명 · 미응답 '+(group.length-ga-gb)+'명</small></div></td></tr>';last=g}h+='<tr><td>'+esc(a.generation)+'기</td><td>'+esc(a.name)+'</td><td>'+esc(a.school)+'</td><td>'+esc(a.position)+'</td><td>'+badge(a.status)+'</td><td>'+date(a.updated_at)+'</td></tr>'});$('attBody').innerHTML=h||'<tr><td colspan="6">표시할 데이터가 없습니다.</td></tr>'}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>adminPanel(b.dataset.admin));document.querySelectorAll('[data-fee]').forEach(b=>b.onclick=()=>feePanel(b.dataset.fee));document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>eventPanel(b.dataset.event));document.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>{S.attChoice=b.dataset.att;document.querySelectorAll('[data-att]').forEach(x=>x.classList.toggle('active',x===b));showMsg('attMsg',S.attChoice+'으로 선택되었습니다.','ok')});
$('guideBtn').onclick=guide;$('registerBtn').onclick=register;$('attSave').onclick=saveAtt;$('loginBtn').onclick=login;$('adminPin').onkeydown=e=>{if(e.key==='Enter')login()};$('refreshBtn').onclick=loadAdmin;['mSchool','mPosition','mGeneration','mSort','mKeyword'].forEach(id=>$(id).addEventListener(id==='mKeyword'?'input':'change',renderMembers));['fPaid','fPos','fGen','fKeyword'].forEach(id=>$(id).addEventListener(id==='fKeyword'?'input':'change',renderFees));$('saveNotice').onclick=saveNotice;$('resetNotice').onclick=resetNotice;$('saveUse').onclick=saveUse;$('resetUse').onclick=resetUse;$('uCat').onchange=()=>renderUseOptions();$('uSub').onchange=toggleCustom;$('saveEvent').onclick=saveEvent;$('resetEvent').onclick=resetEvent;$('deleteGuide').onclick=deleteGuide;['aStatus','aSchool','aPos','aGroup','aKeyword'].forEach(id=>$(id).addEventListener(id==='aKeyword'?'input':'change',renderAttAdmin));
resetUse();view(isAdmin?'admin':'notices');loadPublic().catch(e=>showMsg('msg','자료를 불러오지 못했습니다: '+e.message,'bad'));
</script>
</body>
