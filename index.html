<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경인교대 파주동문회</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f8;color:#142033}*{box-sizing:border-box}body{margin:0}.app{width:min(980px,calc(100% - 28px));margin:0 auto;padding:24px 0 42px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:22px;background:#fff;border:1px solid #d8dee8;border-radius:8px}.year-label{margin:0 0 4px;color:#56657a;font-weight:800}h1,h2,h3,p{margin:0}h1{font-size:clamp(27px,3.3vw,38px);line-height:1.15}h2{font-size:22px;margin-bottom:14px}h3{font-size:18px;line-height:1.35}.guide-button{min-width:112px}.status-band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.stat{display:grid;gap:4px;min-height:76px;padding:15px;background:#fff;border:1px solid #d8dee8;border-radius:8px}.stat span{color:#667085;font-size:14px;font-weight:800}.stat strong{font-size:28px;line-height:1.1}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}button{min-height:44px;border:0;border-radius:8px;padding:10px 16px;background:#176b87;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:hover{background:#12576e}button:disabled{opacity:.65;cursor:wait}.actions button{background:#27364a}.actions button.active{background:#176b87}button.secondary{background:#4b5565}.panel{padding:20px;background:#fff;border:1px solid #d8dee8;border-radius:8px}.notice-list{display:grid;gap:10px}.notice{border:1px solid #e0e7ef;border-radius:8px;background:#fbfcfe;overflow:hidden}.notice-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:15px 16px}.notice time{white-space:nowrap;color:#6b7688;font-size:14px}.notice-body{padding:0 16px 16px;color:#344258;line-height:1.72;white-space:pre-line}.notice summary{margin:0 16px 16px;color:#176b87;font-weight:900;cursor:pointer}.notice a{display:inline-flex;margin:0 16px 16px;color:#176b87;font-weight:900}.event-summary{display:grid;gap:6px;padding:14px;border:1px solid #e2e8f0;border-radius:8px;background:#fbfcfe}.event-summary p,.empty{color:#5d6878}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.wide{grid-column:1/-1}label{display:grid;gap:6px;font-weight:800}input,select{width:100%;min-height:42px;border:1px solid #c7d0dd;border-radius:8px;padding:8px 10px;background:#fff;color:#182230;font:inherit}input:focus,select:focus{outline:3px solid #c9edf5;border-color:#176b87}.agree{display:flex;align-items:center;gap:8px;margin:4px 0 16px}.agree input{width:18px;min-height:18px}.attendance-actions{display:flex;gap:10px;flex-wrap:wrap}.message,.admin-message{margin-bottom:14px;padding:12px 14px;border-radius:8px;background:#fff7d6;color:#5c4700;font-weight:800}.message[data-tone=success],.admin-message.success{background:#e7f7ed;color:#126233}.message[data-tone=warn],.admin-message.warn{background:#fff0e8;color:#8a3a12}.admin-box{max-width:420px}.hidden{display:none}@media(max-width:720px){.topbar,.actions,.form-grid,.status-band{grid-template-columns:1fr}.topbar{display:grid}.attendance-actions button,.guide-button{width:100%}.notice-head{display:grid}.notice time{white-space:normal}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><p id="currentYear" class="year-label">불러오는 중</p><h1 id="appName">경인교대 파주동문회</h1></div>
      <button id="eventGuideBtn" class="guide-button" type="button">행사 안내</button>
    </header>

    <section class="status-band" aria-label="행사 참석 현황">
      <div class="stat"><span>전체 인원</span><strong id="summaryTotal">-</strong></div>
      <div class="stat"><span>참석 인원</span><strong id="summaryAttend">-</strong></div>
      <div class="stat"><span>불참 인원</span><strong id="summaryAbsent">-</strong></div>
    </section>

    <nav class="actions" aria-label="주요 메뉴">
      <button data-view="notices" type="button">공지사항</button>
      <button data-view="register" type="button">회원 등록</button>
      <button data-view="attendance" type="button">행사 참석</button>
      <button data-view="admin" type="button">관리자</button>
    </nav>

    <section id="message" class="message hidden" role="status"></section>
    <section id="noticesView" class="panel"></section>

    <section id="registerView" class="panel hidden">
      <h2>회원 등록</h2>
      <div class="form-grid">
        <label>이름<input id="regName" autocomplete="name"></label>
        <label>학번<input id="regStudentNo" inputmode="numeric"></label>
        <label>직위<select id="regPosition"><option value="">선택</option><option>교사</option><option>교감</option><option>교장</option><option>장학사</option><option>기타</option></select></label>
        <label>현재 학교<input id="regSchool" list="schoolOptions"></label>
        <label class="wide">연락처<input id="regPhone" inputmode="tel" autocomplete="tel"></label>
      </div>
      <datalist id="schoolOptions"></datalist>
      <label class="agree"><input id="regAgree" type="checkbox"> 개인정보 수집 및 이용에 동의합니다.</label>
      <button id="registerBtn" type="button">등록하기</button>
    </section>

    <section id="attendanceView" class="panel hidden"><h2>행사 참석</h2><div id="eventBox"></div></section>

    <section id="adminView" class="panel hidden">
      <h2>관리자 로그인</h2>
      <div class="admin-box">
        <label>관리자 PIN<input id="adminPin" type="password" inputmode="numeric" autocomplete="current-password"></label>
        <button id="adminLoginBtn" type="button">로그인</button>
      </div>
      <div id="adminMsg" class="admin-message hidden"></div>
      <div id="adminPanel" class="hidden">
        <p class="empty">관리자 기능을 연결하는 중입니다. 다음 단계에서 공지, 행사, 첨부파일 관리를 붙이겠습니다.</p>
      </div>
    </section>
  </main>

  <script>
    const db=window.supabase.createClient('https://lemwzcchuazqpsyzsoff.supabase.co','sb_publishable_dXOuhuPizNsQgCXtqQYY4A_DBk6WCGV');
    const state={settings:{},notices:[],events:[],schools:[],attendanceSummary:null,activeEvent:null};
    const $=id=>document.getElementById(id);
    function showMessage(text,tone='info'){const el=$('message');if(!text){el.classList.add('hidden');el.textContent='';return}el.textContent=text;el.dataset.tone=tone;el.classList.remove('hidden')}
    function switchView(name){['notices','register','attendance','admin'].forEach(v=>$(`${v}View`).classList.toggle('hidden',v!==name));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name))}
    async function loadApp(){showMessage('');const {data,error}=await db.rpc('get_public_alumni_app_data');if(error)throw error;state.settings=data?.settings||{};state.notices=data?.notices||[];state.events=data?.events||[];state.schools=data?.schools||[];state.attendanceSummary=data?.attendance_summary||null;state.activeEvent=findActiveEvent();renderHeader();renderSummary();renderSchoolOptions();renderNotices();renderAttendance()}
    function findActiveEvent(){if(state.attendanceSummary?.event_id){const e=state.events.find(x=>x.id===state.attendanceSummary.event_id);if(e)return e}return state.events.find(e=>e.active)||state.events[0]||null}
    function renderHeader(){$('appName').textContent=state.settings.alumni_name||'경인교대 파주동문회';$('currentYear').textContent=`${state.settings.current_year||new Date().getFullYear()}년도`}
    function renderSummary(){const s=state.attendanceSummary||{};$('summaryTotal').textContent=s.total??'-';$('summaryAttend').textContent=s.attend??'-';$('summaryAbsent').textContent=s.absent??'-'}
    function renderSchoolOptions(){$('schoolOptions').innerHTML=state.schools.map(s=>`<option value="${esc(s.name||'')}"></option>`).join('')}
    function renderNotices(){const box=$('noticesView');if(!state.notices.length){box.innerHTML='<h2>공지사항</h2><p class="empty">등록된 공지사항이 없습니다.</p>';return}box.innerHTML='<h2>공지사항</h2><div class="notice-list">'+state.notices.map((n,i)=>{const d=n.created_at?new Date(n.created_at).toLocaleDateString('ko-KR'):'';const body=n.content?`<details ${i===0?'open':''}><summary>내용 보기</summary><div class="notice-body">${esc(n.content)}</div></details>`:'';const file=n.file_url?`<a href="${esc(n.file_url)}" target="_blank" rel="noreferrer">첨부파일 보기</a>`:'';return `<article class="notice"><div class="notice-head"><h3>${esc(n.title||'')}</h3>${d?`<time>${esc(d)}</time>`:''}</div>${body}${file}</article>`}).join('')+'</div>'}
    function renderAttendance(){const box=$('eventBox'),e=state.activeEvent;if(!e){box.innerHTML='<p class="empty">등록된 행사가 없습니다.</p>';return}const d=e.event_date?new Date(`${e.event_date}T00:00:00`).toLocaleDateString('ko-KR'):'';box.innerHTML=`<article class="event-summary"><h3>${esc(e.title||'동문회 행사')}</h3><p>${esc([d,e.place].filter(Boolean).join(' · '))}</p></article><div class="form-grid"><label>이름<input id="attName" autocomplete="name"></label><label>현재 학교<input id="attSchool" list="schoolOptions"></label></div><div class="attendance-actions"><button type="button" data-att-status="참석">참석</button><button type="button" data-att-status="불참" class="secondary">불참</button></div>`;document.querySelectorAll('[data-att-status]').forEach(b=>b.addEventListener('click',()=>submitAttendance(b.dataset.attStatus,b)))}
    async function openEventGuide(){const btn=$('eventGuideBtn'),old=btn.textContent;btn.disabled=true;btn.textContent='불러오는 중';try{const e=state.activeEvent;if(!e?.pdf_file_url){alert('행사안내가 없습니다.');return}window.open(e.pdf_file_url,'_blank','noreferrer')}finally{btn.disabled=false;btn.textContent=old}}
    async function registerMember(){const btn=$('registerBtn');const p={p_name:$('regName').value.trim(),p_student_no:$('regStudentNo').value.trim(),p_position:$('regPosition').value.trim(),p_school:$('regSchool').value.trim(),p_phone:$('regPhone').value.trim(),p_privacy_agreed:$('regAgree').checked};if(!p.p_name||!p.p_student_no||!p.p_privacy_agreed){showMessage('이름, 학번, 개인정보 동의를 확인해 주세요.','warn');return}await loading(btn,'등록 중',async()=>{const {data,error}=await db.rpc('register_alumni_member',p);if(error)throw error;['regName','regStudentNo','regPosition','regSchool','regPhone'].forEach(id=>$(id).value='');$('regAgree').checked=false;await loadApp();showMessage(`${data.name}님 등록이 완료되었습니다.`,'success')})}
    async function submitAttendance(status,btn){const e=state.activeEvent;if(!e){showMessage('등록된 행사가 없습니다.','warn');return}const p={p_event_id:e.id,p_name:$('attName').value.trim(),p_school:$('attSchool').value.trim(),p_status:status};if(!p.p_name){showMessage('이름을 입력해 주세요.','warn');return}await loading(btn,'저장 중',async()=>{const {data,error}=await db.rpc('submit_event_attendance',p);if(error)throw error;await loadApp();switchView('attendance');showMessage(`${data.name}님 ${data.status}으로 저장되었습니다.`,'success')})}
    function adminLogin(){const msg=$('adminMsg');msg.classList.remove('hidden','success','warn');if($('adminPin').value.trim()==='1234'){msg.textContent='관리자 로그인 성공';msg.classList.add('success');$('adminPanel').classList.remove('hidden')}else{msg.textContent='PIN을 확인해 주세요.';msg.classList.add('warn');$('adminPanel').classList.add('hidden')}}
    async function loading(btn,text,fn){const old=btn.textContent;btn.disabled=true;btn.textContent=text;try{await fn()}catch(e){console.error(e);showMessage(e.message||'처리 중 문제가 생겼습니다.','warn')}finally{btn.disabled=false;btn.textContent=old}}
    function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
    document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));$('eventGuideBtn').addEventListener('click',openEventGuide);$('registerBtn').addEventListener('click',registerMember);$('adminLoginBtn').addEventListener('click',adminLogin);switchView('notices');loadApp().catch(e=>{console.error(e);showMessage('자료를 불러오지 못했습니다. Supabase 설정을 확인해 주세요.','warn')});
  </script>
</body>
</html>
