<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경인교대 파주동문회</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f8;color:#142033}*{box-sizing:border-box}body{margin:0}.app{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:24px 0 42px}h1,h2,h3,p{margin:0}h1{font-size:clamp(27px,3.3vw,38px);line-height:1.15}h2{font-size:22px;margin-bottom:14px}h3{font-size:18px}.topbar,.panel{background:#fff;border:1px solid #d8dee8;border-radius:8px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:22px}.year-label{margin:0 0 4px;color:#56657a;font-weight:800}.status-band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.stat{display:grid;gap:4px;min-height:76px;padding:15px;background:#fff;border:1px solid #d8dee8;border-radius:8px}.stat span,.empty,time{color:#667085}.stat span{font-size:14px;font-weight:800}.stat strong{font-size:28px}.actions,.admin-tabs,.subtabs{display:grid;gap:10px;margin-bottom:14px}.actions,.admin-tabs{grid-template-columns:repeat(4,minmax(0,1fr))}.subtabs{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:4px}button{min-height:44px;border:0;border-radius:8px;padding:10px 16px;background:#176b87;color:#fff;font:inherit;font-weight:800;cursor:pointer}.actions button,.admin-tabs button{background:#27364a}.subtabs button,button.light{background:#e8edf3;color:#1f2a3a}.actions button.active,.admin-tabs button.active,.subtabs button.active{background:#176b87;color:#fff}button.secondary{background:#4b5565}.panel{padding:20px}.notice-list,.admin-list{display:grid;gap:10px}.notice,.admin-item,.admin-card{border:1px solid #e0e7ef;border-radius:8px;background:#fbfcfe;overflow:hidden}.notice-head,.admin-item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:15px 16px}.notice-body{padding:0 16px 16px;color:#344258;line-height:1.72;white-space:pre-line}.notice summary{margin:0 16px 16px;color:#176b87;font-weight:900;cursor:pointer}.notice a{display:inline-flex;margin:0 16px 16px;color:#176b87;font-weight:900}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.wide{grid-column:1/-1}label{display:grid;gap:6px;font-weight:800}input,select,textarea{width:100%;min-height:42px;border:1px solid #c7d0dd;border-radius:8px;padding:8px 10px;background:#fff;color:#182230;font:inherit}textarea{min-height:120px;resize:vertical}.agree,.checkline{display:flex;align-items:center;gap:8px;margin:4px 0 16px}.agree input,.checkline input{width:18px;min-height:18px}.row-actions{display:flex;gap:10px;flex-wrap:wrap}.message,.admin-message{margin-bottom:14px;padding:12px 14px;border-radius:8px;background:#fff7d6;color:#5c4700;font-weight:800}.message[data-tone=success],.admin-message.success{background:#e7f7ed;color:#126233}.message[data-tone=warn],.admin-message.warn{background:#fff0e8;color:#8a3a12}.admin-box{max-width:420px;display:grid}.admin-box button{justify-self:end;margin-top:10px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.admin-card{display:grid;gap:10px;padding:16px}.table-wrap{overflow:auto;border:1px solid #dfe6ef;border-radius:8px;background:#fff}.admin-table{width:100%;border-collapse:collapse;min-width:760px}.admin-table th,.admin-table td{border-bottom:1px solid #edf1f5;padding:10px;text-align:left;font-size:14px}.admin-table th{background:#f6f8fb}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.summary span{padding:8px 10px;border:1px solid #dfe6ef;border-radius:8px;background:#fff;font-weight:800}.hidden{display:none}@media(max-width:760px){.topbar,.actions,.admin-tabs,.subtabs,.form-grid,.status-band,.admin-grid{grid-template-columns:1fr}.topbar{display:grid}.guide-button,.admin-box button{width:100%}.notice-head,.admin-item-head{display:grid}}</style></head><body><main class="app"><header class="topbar"><div><p id="currentYear" class="year-label">불러오는 중</p><h1 id="appName">경인교대 파주동문회</h1></div><button id="eventGuideBtn" class="guide-button" type="button">행사 안내</button></header><section class="status-band"><div class="stat"><span>전체 인원</span><strong id="summaryTotal">-</strong></div><div class="stat"><span>참석 인원</span><strong id="summaryAttend">-</strong></div><div class="stat"><span>불참 인원</span><strong id="summaryAbsent">-</strong></div></section><nav class="actions"><button data-view="notices" type="button">공지사항</button><button data-view="register" type="button">회원 등록</button><button data-view="attendance" type="button">행사 참석</button><button data-view="admin" type="button">관리자</button></nav><section id="message" class="message hidden"></section><section id="noticesView" class="panel"></section><section id="registerView" class="panel hidden"><h2>회원 등록</h2><div class="form-grid"><label>이름<input id="regName" autocomplete="name"></label><label>학번<input id="regStudentNo" inputmode="numeric"></label><label>직위<select id="regPosition"><option value="">선택</option><option>교사</option><option>교감</option><option>교장</option><option>늘봄실장</option><option>장학사</option><option>장학관</option><option>기타</option></select></label><label>현재 학교<input id="regSchool" list="schoolOptions"></label><label class="wide">연락처<input id="regPhone" inputmode="tel" autocomplete="tel"></label></div><datalist id="schoolOptions"></datalist><label class="agree"><input id="regAgree" type="checkbox"> 개인정보 수집 및 이용에 동의합니다.</label><button id="registerBtn" type="button">등록하기</button></section><section id="attendanceView" class="panel hidden"><h2>행사 참석</h2><div id="eventBox"></div></section><section id="adminView" class="panel hidden"><h2>관리자 로그인</h2><div id="adminLoginBox" class="admin-box"><label>관리자 PIN<input id="adminPin" type="password" autocomplete="current-password"></label><button id="adminLoginBtn" type="button">로그인</button></div><div id="adminMsg" class="admin-message hidden"></div><div id="adminPanel" class="hidden"><nav class="admin-tabs"><button data-admin-panel="members" type="button">명단</button><button data-admin-panel="notices" type="button">공지사항</button><button data-admin-panel="fees" type="button">회비</button><button data-admin-panel="events" type="button">행사</button></nav><section id="membersPanel"><h3>회원명단 관리</h3><div id="memberSummary" class="summary"></div><div class="form-grid"><input id="memberKeyword" placeholder="이름 / 학교 / 학번 검색" oninput="renderMembers()"><select id="memberPosition" onchange="renderMembers()"><option value="">전체 직위</option></select></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>학교</th><th>직위</th><th>성명</th><th>기수</th><th>학번</th><th>전화번호</th><th>대의원</th></tr></thead><tbody id="memberTableBody"></tbody></table></div></section><section id="noticesPanel" class="hidden"><h3>공지사항 관리</h3><div class="admin-grid"><section class="admin-card"><input id="noticeId" type="hidden"><label>제목<input id="noticeTitle"></label><label>내용<textarea id="noticeContent"></textarea></label><label>첨부파일 이름<input id="noticeFileName"></label><label>첨부파일 주소<input id="noticeFileUrl" placeholder="https://..."></label><label class="checkline"><input id="noticePublic" type="checkbox" checked> 공개</label><label class="checkline"><input id="noticeImportant" type="checkbox"> 중요</label><div class="row-actions"><button id="saveNoticeBtn" type="button">공지 저장</button><button id="resetNoticeBtn" type="button" class="light">새 공지</button></div></section><section><h3>공지 목록</h3><div id="adminNoticeList" class="admin-list"></div></section></div></section><section id="feesPanel" class="hidden"><h3>회비 관리</h3><nav class="subtabs"><button data-fee-panel="feePay" type="button">회비납부</button><button data-fee-panel="feeUse" type="button">사용</button><button data-fee-panel="settlement" type="button">결산</button></nav><section id="feePayPanel"><div id="feeSummary" class="summary"></div><div class="form-grid"><select id="feeFilterPaid" onchange="renderFees()"><option value="">전체 납부상태</option><option value="paid">납부</option><option value="unpaid">미납</option></select><input id="feeKeyword" placeholder="이름 / 기수 / 직위 검색" oninput="renderFees()"></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>성명</th><th>기수</th><th>직위</th><th>회비</th><th>납부</th><th>납부일</th></tr></thead><tbody id="feeTableBody"></tbody></table></div></section><section id="feeUsePanel" class="hidden"><div class="admin-card"><input id="feeUseId" type="hidden"><div class="form-grid"><label>날짜<input id="feeUseDate" type="date"></label><label>관<select id="feeUseCategory"><option value="수입">수입</option><option value="운영비">운영비</option><option value="행사비">행사비</option></select></label><label>항<input id="feeUseSubcategory" placeholder="예: 정기총회"></label><label>목<input id="feeUseItem" placeholder="예: 식대"></label><label>수입<input id="feeUseIncome" type="number" value="0"></label><label>지출<input id="feeUseExpense" type="number" value="0"></label><label class="wide">비고<input id="feeUseNote"></label></div><div class="row-actions"><button id="saveFeeUseBtn" type="button">사용내역 저장</button><button id="resetFeeUseBtn" type="button" class="light">새로쓰기</button></div></div><div class="table-wrap" style="margin-top:12px"><table class="admin-table"><thead><tr><th>날짜</th><th>관</th><th>항</th><th>목</th><th>수입</th><th>지출</th><th>비고</th><th>관리</th></tr></thead><tbody id="feeUseTableBody"></tbody></table></div></section><section id="settlementPanel" class="hidden"><div id="settlementSummary" class="summary"></div><div class="row-actions"><button id="printSettlementBtn" type="button">PDF로 저장</button></div><div id="settlementPreview" class="admin-card" style="margin-top:12px"></div></section></section><section id="eventsPanel" class="hidden"><h3>행사 관리</h3><nav class="subtabs"><button data-event-panel="eventManage" type="button">행사관리</button><button data-event-panel="eventGuide" type="button">안내</button><button data-event-panel="attendanceAdmin" type="button">참석현황</button></nav><section id="eventManagePanel"><div class="admin-grid"><section class="admin-card"><input id="eventId" type="hidden"><label>행사명<input id="eventTitle"></label><label>날짜<input id="eventDate" type="date"></label><label>장소<input id="eventPlace"></label><label>내용<textarea id="eventContent"></textarea></label><label>행사안내 PDF 이름<input id="eventPdfName"></label><label>행사안내 PDF 주소<input id="eventPdfUrl" placeholder="https://..."></label><label class="checkline"><input id="eventActive" type="checkbox" checked> 현재 행사로 사용</label><div class="row-actions"><button id="saveEventBtn" type="button">행사 저장</button><button id="clearEventPdfBtn" type="button" class="secondary">PDF 삭제</button><button id="resetEventBtn" type="button" class="light">새 행사</button></div></section><section><h3>행사 목록</h3><div id="adminEventList" class="admin-list"></div></section></div></section><section id="eventGuidePanel" class="hidden"><div id="eventGuideList" class="admin-list"></div></section><section id="attendanceAdminPanel" class="hidden"><div id="attendanceAdminSummary" class="summary"></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>학교</th><th>기수</th><th>이름</th><th>직위</th><th>참석여부</th><th>수정일</th></tr></thead><tbody id="attendanceAdminBody"></tbody></table></div></section></section></div></section></main><script>const db=window.supabase.createClient('https://lemwzcchuazqpsyzsoff.supabase.co','sb_publishable_dXOuhuPizNsQgCXtqQYY4A_DBk6WCGV');const state={settings:{},notices:[],events:[],schools:[],attendanceSummary:null,activeEvent:null,adminPin:'',adminNotices:[],adminEvents:[],adminMembers:[],feeSummary:{},feeUses:[],settlement:{},attendanceAdmin:{},attendanceList:[]};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');const money=v=>Number(v||0).toLocaleString();function showMessage(t,tone='info'){const e=$('message');if(!t){e.classList.add('hidden');e.textContent='';return}e.textContent=t;e.dataset.tone=tone;e.classList.remove('hidden')}function showAdminMsg(t,tone='success'){const e=$('adminMsg');e.textContent=t;e.className=`admin-message ${tone}`}function switchView(name){['notices','register','attendance','admin'].forEach(v=>$(`${v}View`).classList.toggle('hidden',v!==name));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name))}function showAdminPanel(name){['members','notices','fees','events'].forEach(v=>$(`${v}Panel`).classList.toggle('hidden',v!==name));document.querySelectorAll('[data-admin-panel]').forEach(b=>b.classList.toggle('active',b.dataset.adminPanel===name));if(name==='fees')showFeePanel('feePay');if(name==='events')showEventPanel('eventManage')}function showFeePanel(name){['feePay','feeUse','settlement'].forEach(v=>$(`${v}Panel`).classList.toggle('hidden',v!==name));document.querySelectorAll('[data-fee-panel]').forEach(b=>b.classList.toggle('active',b.dataset.feePanel===name));if(name==='settlement')renderSettlement()}function showEventPanel(name){['eventManage','eventGuide','attendanceAdmin'].forEach(v=>$(`${v}Panel`).classList.toggle('hidden',v!==name));document.querySelectorAll('[data-event-panel]').forEach(b=>b.classList.toggle('active',b.dataset.eventPanel===name))}async function loadApp(){showMessage('');const{data,error}=await db.rpc('get_public_alumni_app_data');if(error)throw error;state.settings=data?.settings||{};state.notices=data?.notices||[];state.events=data?.events||[];state.schools=data?.schools||[];state.attendanceSummary=data?.attendance_summary||null;state.activeEvent=findActiveEvent();renderHeader();renderSummary();renderSchoolOptions();renderNotices();renderAttendance()}function findActiveEvent(){if(state.attendanceSummary?.event_id){const e=state.events.find(x=>x.id===state.attendanceSummary.event_id);if(e)return e}return state.events.find(e=>e.active)||state.events[0]||null}function renderHeader(){$('appName').textContent=state.settings.alumni_name||'경인교대 파주동문회';$('currentYear').textContent=`${state.settings.current_year||new Date().getFullYear()}년도`}function renderSummary(){const s=state.attendanceSummary||{};$('summaryTotal').textContent=s.total??'-';$('summaryAttend').textContent=s.attend??'-';$('summaryAbsent').textContent=s.absent??'-'}function renderSchoolOptions(){$('schoolOptions').innerHTML=state.schools.map(s=>`<option value="${esc(s.name||'')}"></option>`).join('')}function renderNotices(){const box=$('noticesView');if(!state.notices.length){box.innerHTML='<h2>공지사항</h2><p class="empty">등록된 공지사항이 없습니다.</p>';return}box.innerHTML='<h2>공지사항</h2><div class="notice-list">'+state.notices.map((n,i)=>{const d=n.created_at?new Date(n.created_at).toLocaleDateString('ko-KR'):'';return`<article class="notice"><div class="notice-head"><h3>${esc(n.title||'')}</h3>${d?`<time>${esc(d)}</time>`:''}</div>${n.content?`<details ${i===0?'open':''}><summary>내용 보기</summary><div class="notice-body">${esc(n.content)}</div></details>`:''}${n.file_url?`<a href="${esc(n.file_url)}" target="_blank">첨부파일 보기</a>`:''}</article>`}).join('')+'</div>'}function renderAttendance(){const box=$('eventBox'),e=state.activeEvent;if(!e){box.innerHTML='<p class="empty">등록된 행사가 없습니다.</p>';return}const d=e.event_date?new Date(`${e.event_date}T00:00:00`).toLocaleDateString('ko-KR'):'';box.innerHTML=`<article class="admin-item" style="padding:14px"><h3>${esc(e.title||'동문회 행사')}</h3><p class="empty">${esc([d,e.place].filter(Boolean).join(' · '))}</p></article><div class="form-grid"><label>이름<input id="attName"></label><label>현재 학교<input id="attSchool" list="schoolOptions"></label></div><div class="row-actions"><button type="button" data-att-status="참석">참석</button><button type="button" data-att-status="불참" class="secondary">불참</button></div>`;document.querySelectorAll('[data-att-status]').forEach(b=>b.addEventListener('click',()=>submitAttendance(b.dataset.attStatus,b)))}async function openEventGuide(){const b=$('eventGuideBtn'),old=b.textContent;b.disabled=true;b.textContent='불러오는 중';try{const e=state.activeEvent;if(!e?.pdf_file_url){alert('행사안내가 없습니다.');return}window.open(e.pdf_file_url,'_blank')}finally{b.disabled=false;b.textContent=old}}async function registerMember(){const p={p_name:$('regName').value.trim(),p_student_no:$('regStudentNo').value.trim(),p_position:$('regPosition').value.trim(),p_school:$('regSchool').value.trim(),p_phone:$('regPhone').value.trim(),p_privacy_agreed:$('regAgree').checked};if(!p.p_name||!p.p_student_no||!p.p_privacy_agreed){showMessage('이름, 학번, 개인정보 동의를 확인해 주세요.','warn');return}const{data,error}=await db.rpc('register_alumni_member',p);if(error){showMessage(error.message,'warn');return}showMessage(`${data.name}님 등록이 완료되었습니다.`,'success');await loadApp()}async function submitAttendance(status,b){const e=state.activeEvent,p={p_event_id:e?.id,p_name:$('attName').value.trim(),p_school:$('attSchool').value.trim(),p_status:status};if(!p.p_event_id||!p.p_name){showMessage('행사와 이름을 확인해 주세요.','warn');return}const{data,error}=await db.rpc('submit_event_attendance',p);if(error){showMessage(error.message,'warn');return}await loadApp();switchView('attendance');showMessage(`${data.name}님 ${data.status}으로 저장되었습니다.`,'success')}async function adminLogin(){const pin=$('adminPin').value.trim();const{data,error}=await db.rpc('verify_admin_pin',{p_pin:pin});if(error||!data){showAdminMsg('PIN을 확인해 주세요.','warn');return}state.adminPin=pin;$('adminLoginBox').classList.add('hidden');$('adminPanel').classList.remove('hidden');showAdminMsg('관리자 로그인 성공','success');await loadAdminData();showAdminPanel('members')}async function loadAdminData(){const{data,error}=await db.rpc('get_admin_alumni_app_data',{p_pin:state.adminPin});if(error){showAdminMsg(error.message,'warn');return}Object.assign(state,{adminNotices:data?.notices||[],adminEvents:data?.events||[],adminMembers:data?.members||[],feeSummary:data?.fee_summary||{},feeUses:data?.fee_uses||[],settlement:data?.settlement_summary||{},attendanceAdmin:data?.attendance_summary||{},attendanceList:data?.attendance_list||[]});renderAllAdmin()}function renderAllAdmin(){renderNoticeList();renderEventList();renderMembers();renderFees();renderFeeUses();renderSettlement();renderEventGuideList();renderAttendanceAdmin();fillMemberPositionOptions()}function fillMemberPositionOptions(){const el=$('memberPosition'),cur=el.value,vals=[...new Set(state.adminMembers.map(m=>m.position).filter(Boolean))].sort();el.innerHTML='<option value="">전체 직위</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');el.value=cur}function filteredMembers(){const kw=($('memberKeyword')?.value||'').toLowerCase().trim(),pos=$('memberPosition')?.value||'';return state.adminMembers.filter(m=>(!pos||m.position===pos)&&(!kw||`${m.name} ${m.school} ${m.student_no} ${m.phone} ${m.generation}`.toLowerCase().includes(kw)))}function renderMembers(){const list=filteredMembers();$('memberSummary').innerHTML=`<span>전체 <b>${list.length}</b>명</span><span>교장 <b>${list.filter(m=>m.position==='교장').length}</b>명</span><span>교감 <b>${list.filter(m=>m.position==='교감').length}</b>명</span><span>교사 <b>${list.filter(m=>m.position==='교사').length}</b>명</span>`;$('memberTableBody').innerHTML=list.map(m=>`<tr><td>${esc(m.school)}</td><td>${esc(m.position)}</td><td>${esc(m.name)}</td><td>${esc(m.generation||'')}기</td><td>${esc(m.student_no)}</td><td>${esc(m.phone)}</td><td><button class="light" onclick="toggleDelegate('${m.member_id}','${m.delegate?'':'Y'}')">${m.delegate?'대의원':'일반'}</button></td></tr>`).join('')||'<tr><td colspan="7">회원이 없습니다.</td></tr>'}function renderFees(){const kw=($('feeKeyword')?.value||'').toLowerCase().trim(),paid=$('feeFilterPaid')?.value||'';const list=state.adminMembers.filter(m=>(!paid||(paid==='paid'?m.fee_paid:!m.fee_paid))&&(!kw||`${m.name} ${m.generation} ${m.position}`.toLowerCase().includes(kw)));const s=state.feeSummary;$('feeSummary').innerHTML=`<span>전체 <b>${s.total||0}</b>명</span><span>납부 <b>${s.paid||0}</b>명</span><span>미납 <b>${s.unpaid||0}</b>명</span><span>납부액 <b>${money(s.paid_amount)}</b>원</span>`;$('feeTableBody').innerHTML=list.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.generation||'')}기</td><td>${esc(m.position)}</td><td>${money(m.fee_amount)}원</td><td><input type="checkbox" ${m.fee_paid?'checked':''} onchange="updateFee('${m.member_id}',this.checked,'${m.fee_amount||0}')"></td><td>${esc(m.fee_paid_date||'')}</td></tr>`).join('')||'<tr><td colspan="6">회비 데이터가 없습니다.</td></tr>'}function renderFeeUses(){$('feeUseTableBody').innerHTML=state.feeUses.map(u=>`<tr><td>${esc(u.used_on||'')}</td><td>${esc(u.category||'')}</td><td>${esc(u.subcategory||'')}</td><td>${esc(u.item||'')}</td><td>${money(u.income)}원</td><td>${money(u.expense)}원</td><td>${esc(u.note||'')}</td><td><button class="light" onclick="fillFeeUse('${u.id}')">수정</button><button class="secondary" onclick="deleteFeeUse('${u.id}')">삭제</button></td></tr>`).join('')||'<tr><td colspan="8">회비 사용 내역이 없습니다.</td></tr>'}function fillFeeUse(id){const u=state.feeUses.find(x=>x.id===id);if(!u)return;$('feeUseId').value=u.id;$('feeUseDate').value=u.used_on||'';$('feeUseCategory').value=u.category||'운영비';$('feeUseSubcategory').value=u.subcategory||'';$('feeUseItem').value=u.item||'';$('feeUseIncome').value=u.income||0;$('feeUseExpense').value=u.expense||0;$('feeUseNote').value=u.note||''}function resetFeeUse(){['feeUseId','feeUseSubcategory','feeUseItem','feeUseNote'].forEach(id=>$(id).value='');$('feeUseDate').value=new Date().toISOString().slice(0,10);$('feeUseCategory').value='운영비';$('feeUseIncome').value=0;$('feeUseExpense').value=0}async function saveFeeUse(){const p={p_pin:state.adminPin,p_id:$('feeUseId').value||null,p_used_on:$('feeUseDate').value||null,p_category:$('feeUseCategory').value,p_subcategory:$('feeUseSubcategory').value,p_item:$('feeUseItem').value,p_income:Number($('feeUseIncome').value||0),p_expense:Number($('feeUseExpense').value||0),p_note:$('feeUseNote').value};const{error}=await db.rpc('admin_save_fee_use',p);if(error){showAdminMsg(error.message,'warn');return}resetFeeUse();await loadAdminData();showAdminMsg('사용내역을 저장했습니다.','success')}async function deleteFeeUse(id){if(!confirm('사용내역을 삭제할까요?'))return;const{error}=await db.rpc('admin_delete_fee_use',{p_pin:state.adminPin,p_id:id});if(error){showAdminMsg(error.message,'warn');return}await loadAdminData();showAdminMsg('사용내역을 삭제했습니다.','success')}function renderSettlement(){const paid=Number(state.feeSummary.paid_amount||0),income=Number(state.settlement.income||0),expense=Number(state.settlement.expense||0),balance=paid+income-expense;$('settlementSummary').innerHTML=`<span>회비납부액 <b>${money(paid)}</b>원</span><span>기타수입 <b>${money(income)}</b>원</span><span>지출 <b>${money(expense)}</b>원</span><span>잔액 <b>${money(balance)}</b>원</span>`;$('settlementPreview').innerHTML=`<h3>${state.settings.current_year||''}년도 결산보고서</h3><p>총 수입: ${money(paid+income)}원</p><p>총 지출: ${money(expense)}원</p><p><b>잔액: ${money(balance)}원</b></p>`}function printSettlement(){const paid=Number(state.feeSummary.paid_amount||0),income=Number(state.settlement.income||0),expense=Number(state.settlement.expense||0),balance=paid+income-expense;const rows=state.feeUses.map(u=>`<tr><td>${esc(u.used_on||'')}</td><td>${esc(u.category||'')}</td><td>${esc(u.subcategory||'')}</td><td>${esc(u.item||'')}</td><td>${money(u.income)}</td><td>${money(u.expense)}</td><td>${esc(u.note||'')}</td></tr>`).join('');const w=window.open('','_blank');w.document.write(`<html><head><meta charset="utf-8"><title>결산보고서</title><style>body{font-family:sans-serif;padding:32px}h1{text-align:center}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border:1px solid #999;padding:8px;text-align:left}.summary{font-size:18px;line-height:1.8}</style></head><body><h1>${state.settings.current_year||''}년도 결산보고서</h1><div class="summary">총 수입 ${money(paid+income)}원<br>총 지출 ${money(expense)}원<br><b>잔액 ${money(balance)}원</b></div><table><thead><tr><th>날짜</th><th>관</th><th>항</th><th>목</th><th>수입</th><th>지출</th><th>비고</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}function renderEventGuideList(){$('eventGuideList').innerHTML=state.adminEvents.map(e=>`<article class="admin-item"><div class="admin-item-head"><strong>${esc(e.title||'')}</strong><small>${e.pdf_file_url?'안내 있음':'안내 없음'}</small></div><div style="padding:0 16px 14px">${e.pdf_file_url?`<a href="${esc(e.pdf_file_url)}" target="_blank">${esc(e.pdf_file_name||'PDF 보기')}</a>`:'<p class="empty">행사안내 PDF가 없습니다.</p>'}<div class="row-actions" style="margin-top:10px"><button class="light" onclick="fillEvent('${e.id}');showEventPanel('eventManage')">수정</button></div></div></article>`).join('')||'<p class="empty">행사가 없습니다.</p>'}function renderAttendanceAdmin(){const s=state.attendanceAdmin;$('attendanceAdminSummary').innerHTML=`<span>전체 <b>${s.total||0}</b>명</span><span>참석 <b>${s.attend||0}</b>명</span><span>불참 <b>${s.absent||0}</b>명</span><span>미응답 <b>${s.pending||0}</b>명</span>`;$('attendanceAdminBody').innerHTML=state.attendanceList.map(a=>`<tr><td>${esc(a.school)}</td><td>${esc(a.generation||'')}기</td><td>${esc(a.name)}</td><td>${esc(a.position)}</td><td>${esc(a.status)}</td><td>${a.updated_at?esc(new Date(a.updated_at).toLocaleDateString('ko-KR')):''}</td></tr>`).join('')||'<tr><td colspan="6">참석 데이터가 없습니다.</td></tr>'}function renderNoticeList(){$('adminNoticeList').innerHTML=state.adminNotices.map(n=>`<article class="admin-item"><div class="admin-item-head"><strong>${esc(n.title||'')}</strong><small>${n.is_public?'공개':'비공개'}</small></div><div class="row-actions" style="padding:0 16px 14px"><button type="button" class="light" data-edit-notice="${n.id}">수정</button><button type="button" class="secondary" data-delete-notice="${n.id}">삭제</button></div></article>`).join('')||'<p class="empty">공지사항이 없습니다.</p>';document.querySelectorAll('[data-edit-notice]').forEach(b=>b.addEventListener('click',()=>fillNotice(b.dataset.editNotice)));document.querySelectorAll('[data-delete-notice]').forEach(b=>b.addEventListener('click',()=>deleteNotice(b.dataset.deleteNotice)))}function renderEventList(){$('adminEventList').innerHTML=state.adminEvents.map(e=>`<article class="admin-item"><div class="admin-item-head"><strong>${esc(e.title||'')}</strong><small>${e.active?'현재 행사':'비활성'}</small></div><div class="row-actions" style="padding:0 16px 14px"><button type="button" class="light" data-edit-event="${e.id}">수정</button></div></article>`).join('')||'<p class="empty">행사가 없습니다.</p>';document.querySelectorAll('[data-edit-event]').forEach(b=>b.addEventListener('click',()=>fillEvent(b.dataset.editEvent)))}async function updateFee(id,paid,amount){const{error}=await db.rpc('admin_update_fee_status',{p_pin:state.adminPin,p_member_id:id,p_paid:paid,p_paid_date:paid?new Date().toISOString().slice(0,10):null,p_amount:Number(amount||0),p_note:''});if(error){showAdminMsg(error.message,'warn');return}await loadAdminData();showAdminMsg(paid?'납부 처리되었습니다.':'미납 처리되었습니다.','success')}async function toggleDelegate(id,next){const{error}=await db.rpc('admin_update_delegate',{p_pin:state.adminPin,p_member_id:id,p_delegate:next});if(error){showAdminMsg(error.message,'warn');return}await loadAdminData();showAdminMsg('대의원 상태를 변경했습니다.','success')}function fillNotice(id){const n=state.adminNotices.find(x=>x.id===id);if(!n)return;$('noticeId').value=n.id;$('noticeTitle').value=n.title||'';$('noticeContent').value=n.content||'';$('noticeFileName').value=n.file_name||'';$('noticeFileUrl').value=n.file_url||'';$('noticePublic').checked=!!n.is_public;$('noticeImportant').checked=!!n.important}function resetNotice(){['noticeId','noticeTitle','noticeContent','noticeFileName','noticeFileUrl'].forEach(id=>$(id).value='');$('noticePublic').checked=true;$('noticeImportant').checked=false}async function saveNotice(){const p={p_pin:state.adminPin,p_id:$('noticeId').value||null,p_title:$('noticeTitle').value,p_content:$('noticeContent').value,p_file_url:$('noticeFileUrl').value,p_file_name:$('noticeFileName').value,p_is_public:$('noticePublic').checked,p_important:$('noticeImportant').checked};const{error}=await db.rpc('admin_save_notice',p);if(error){showAdminMsg(error.message,'warn');return}resetNotice();await loadAdminData();await loadApp();showAdminMsg('공지사항을 저장했습니다.','success')}async function deleteNotice(id){if(!confirm('공지사항을 삭제할까요?'))return;const{error}=await db.rpc('admin_delete_notice',{p_pin:state.adminPin,p_id:id});if(error){showAdminMsg(error.message,'warn');return}await loadAdminData();await loadApp();showAdminMsg('공지사항을 삭제했습니다.','success')}function fillEvent(id){const e=state.adminEvents.find(x=>x.id===id);if(!e)return;$('eventId').value=e.id;$('eventTitle').value=e.title||'';$('eventDate').value=e.event_date||'';$('eventPlace').value=e.place||'';$('eventContent').value=e.content||'';$('eventPdfName').value=e.pdf_file_name||'';$('eventPdfUrl').value=e.pdf_file_url||'';$('eventActive').checked=!!e.active}function resetEvent(){['eventId','eventTitle','eventDate','eventPlace','eventContent','eventPdfName','eventPdfUrl'].forEach(id=>$(id).value='');$('eventActive').checked=true}async function saveEvent(){const p={p_pin:state.adminPin,p_id:$('eventId').value||null,p_title:$('eventTitle').value,p_event_date:$('eventDate').value||null,p_place:$('eventPlace').value,p_content:$('eventContent').value,p_pdf_file_url:$('eventPdfUrl').value,p_pdf_file_name:$('eventPdfName').value,p_active:$('eventActive').checked};const{error}=await db.rpc('admin_save_event',p);if(error){showAdminMsg(error.message,'warn');return}await loadAdminData();await loadApp();showAdminMsg('행사를 저장했습니다.','success')}async function clearEventPdf(){const id=$('eventId').value;if(!id){showAdminMsg('먼저 행사를 선택해 주세요.','warn');return}if(!confirm('행사안내 PDF를 삭제할까요?'))return;const{error}=await db.rpc('admin_delete_event_guide',{p_pin:state.adminPin,p_event_id:id});if(error){showAdminMsg(error.message,'warn');return}$('eventPdfName').value='';$('eventPdfUrl').value='';await loadAdminData();await loadApp();showAdminMsg('행사안내 PDF를 삭제했습니다.','success')}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));document.querySelectorAll('[data-admin-panel]').forEach(b=>b.addEventListener('click',()=>showAdminPanel(b.dataset.adminPanel)));document.querySelectorAll('[data-fee-panel]').forEach(b=>b.addEventListener('click',()=>showFeePanel(b.dataset.feePanel)));document.querySelectorAll('[data-event-panel]').forEach(b=>b.addEventListener('click',()=>showEventPanel(b.dataset.eventPanel)));$('eventGuideBtn').addEventListener('click',openEventGuide);$('registerBtn').addEventListener('click',registerMember);$('adminLoginBtn').addEventListener('click',adminLogin);$('adminPin').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});$('saveNoticeBtn').addEventListener('click',saveNotice);$('resetNoticeBtn').addEventListener('click',resetNotice);$('saveEventBtn').addEventListener('click',saveEvent);$('resetEventBtn').addEventListener('click',resetEvent);$('clearEventPdfBtn').addEventListener('click',clearEventPdf);$('saveFeeUseBtn').addEventListener('click',saveFeeUse);$('resetFeeUseBtn').addEventListener('click',resetFeeUse);$('printSettlementBtn').addEventListener('click',printSettlement);resetFeeUse();switchView('notices');loadApp().catch(e=>{console.error(e);showMessage('자료를 불러오지 못했습니다. Supabase 설정을 확인해 주세요.','warn')});</script></body></html>
