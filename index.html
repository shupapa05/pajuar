<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>경인교대 파주동문회</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f7;color:#152033}
    .loading{width:min(520px,calc(100% - 32px));margin:80px auto;padding:24px;border:1px solid #d8dee8;border-radius:8px;background:#fff;font-weight:800;text-align:center}
  </style>
</head>
<body>
  <div class="loading">동문회 화면을 불러오는 중입니다...</div>
  <script>
    fetch('https://raw.githubusercontent.com/shupapa05/pajuar/3f001b15fe4b36c6b7b2fac32be59ed39845a7ed/index.html', { cache: 'no-store' })
      .then(function(res) {
        if (!res.ok) throw new Error('load failed');
        return res.text();
      })
      .then(function(html) {
        html = html.replace(
          'id="regPhone" inputmode="tel" autocomplete="tel"',
          'id="regPhone" inputmode="tel" autocomplete="tel" placeholder="예: 010-0000-0000"'
        );
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function() {
        document.body.innerHTML = '<div class="loading">화면을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
      });
  </script>
</body>
</html>
