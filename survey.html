<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>경인교대 파주동문회 설문조사</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f3f6fb;--paper:#fff;--ink:#172033;--muted:#627089;--line:#d9e1ec;--brand:#16718a;--dark:#26364f;--blue:#2f72ee;--red:#dc4b55;--green:#19a974;--soft:#eef4f8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}.wrap{max-width:980px;margin:0 auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-weight:900;font-size:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,30,50,.04)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:var(--muted)}.hidden{display:none!important}h1,h2,h3{margin:0 0 10px}h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid #cfd8e5;border-radius:9px;padding:12px;font:inherit;background:#fff}textarea{min-height:98px;resize:vertical}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:900;cursor:pointer;background:#e8edf4;color:#182238}.btn:disabled{opacity:.6;cursor:not-allowed}.primary{background:var(--brand);color:#fff}.dark{background:var(--dark);color:#fff}.blue{background:var(--blue);color:#fff}.danger{background:var(--red);color:#fff}.mini{padding:7px 10px;border-radius:8px;font-size:13px}.msg{min-height:22px;margin-top:10px;font-weight:800}.msg.ok{color:var(--green)}.msg.err{color:var(--red)}.pill{display:inline-flex;align-items:center;border-radius:999px;background:#eef3f8;padding:6px 10px;font-size:13px;font-weight:900;color:#50617b}.q-card{border:1px solid var(--line);background:#fbfdff;border-radius:9px;padding:14px;margin-top:12px}.option{display:flex;gap:9px;align-items:flex-start;margin:8px 0;padding:10px;border:1px solid #e1e7f0;border-radius:9px;background:#fff}.option input{width:auto;margin-top:5px}.survey-list{display:grid;gap:10px}.survey-item{border:1px solid var(--line);border-radius:9px;padding:13px;background:#fbfdff}.result{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.bar{height:12px;background:#e6edf5;border-radius:999px;overflow:hidden;margin:4px 0 8px}.bar span{display:block;height:100%;background:var(--brand)}.result-line{display:grid;grid-template-columns:minmax(120px,1fr) 90px;gap:10px;align-items:center}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.linkbox{word-break:break-all;background:#f5f8fc;border:1px dashed #b8c7da;border-radius:9px;padding:10px;margin-top:8px}.notice{background:#fff8e8;border-color:#efd58f}@media(max-width:700px){.wrap{padding:12px}.top,.between{align-items:flex-start;flex-direction:column}.admin-grid{grid-template-columns:1fr}.btn{width:100%}.row .btn{width:auto}.result-line{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">경인교대 파주동문회 설문조사</div>
      <div class="row">
        <a class="btn mini" href="./">메인</a>
        <a class="btn mini dark" href="?admin=1">설문 관리</a>
      </div>
    </div>

    <section id="adminArea" class="hidden">
      <div class="card">
        <h1>설문 관리</h1>
        <div class="muted">설문을 만든 뒤 생성된 링크를 공지사항 내용에 붙여넣으면 됩니다.</div>
        <div id="loginBox">
          <div class="field"><label>관리자 PIN</label><input id="pin" type="password" placeholder="관리자 PIN 입력" /></div>
          <button class="btn primary" onclick="adminLogin()">로그인</button>
          <div id="adminMsg" class="msg"></div>
        </div>
      </div>

      <div id="adminPanel" class="hidden">
        <div class="card">
          <div class="between"><h2>새 설문 만들기</h2><button class="btn" onclick="addQuestion()">문항 추가</button></div>
          <div class="admin-grid">
            <div class="field"><label>설문 제목</label><input id="surveyTitle" placeholder="예: 정기총회 참석 희망 조사" /></div>
            <div class="field"><label>응답 기한</label><input id="surveyDeadline" type="datetime-local" /></div>
          </div>
          <div class="field"><label>설문 설명</label><textarea id="surveyDescription" placeholder="설문 안내 문구를 입력하세요."></textarea></div>
          <label class="option"><input id="surveyPublic" type="checkbox" checked /> <span>공개 사용</span></label>
          <div id="questionEditor"></div>
          <div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveSurvey()">설문 저장</button><button class="btn" onclick="resetForm()">새로쓰기</button></div>
          <div id="saveMsg" class="msg"></div>
        </div>

        <div class="card">
          <div class="between"><h2>설문 목록</h2><button class="btn" onclick="loadAdminSurveys()">새로고침</button></div>
          <div id="surveyList" class="survey-list"></div>
        </div>
      </div>
    </section>

    <section id="publicArea" class="hidden">
      <div class="card" id="surveyHeader">
        <h1 id="publicTitle">설문조사</h1>
        <div id="publicDescription" class="muted"></div>
        <div id="deadlineText" class="pill" style="margin-top:10px"></div>
      </div>

      <div class="card notice hidden" id="needIdBox">
        <b>설문 링크가 필요합니다.</b><br />공지사항에 등록된 설문 링크로 접속해주세요.
      </div>

      <div id="surveyBox" class="card hidden">
        <div class="admin-grid">
          <div class="field"><label>이름</label><input id="name" placeholder="이름 입력" /></div>
          <div class="field"><label>연락처</label><input id="phone" placeholder="010-0000-0000" inputmode="tel" /></div>
        </div>
        <div class="row"><button class="btn" onclick="loadSurveyWithPerson()">내 응답 불러오기</button></div>
        <div id="questionList"></div>
        <div class="row" style="margin-top:14px"><button id="submitBtn" class="btn primary" onclick="submitSurvey()">설문 제출</button></div>
        <div id="publicMsg" class="msg"></div>
      </div>

      <div id="resultBox" class="card hidden">
        <h2>현재 투표상황</h2>
        <div class="muted">설문에 참여한 사람에게만 결과가 표시됩니다.</div>
        <div id="results"></div>
      </div>
    </section>
  </div>

<script>
const SUPABASE_URL='https://lemwzcchuazqpsyzsoff.supabase.co';
const SUPABASE_KEY='sb_publishable_dXOuhuPizNsQgCXtqQYY4A_DBk6WCGV';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const state={pin:'',surveys:[],survey:null,questions:[],answers:[],results:[]};
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const surveyId=qs.get('id')||'';
const isAdmin=qs.get('admin')==='1';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function msg(id,text,type=''){const el=$(id);if(!el)return;el.className='msg '+(type||'');el.textContent=text||''}
function koDate(v){if(!v)return'';const d=new Date(v);if(isNaN(d))return v;return d.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function localToIso(v){return v?new Date(v).toISOString():null}
function surveyLink(id){return location.origin+location.pathname+'?id='+encodeURIComponent(id)}
function init(){if(isAdmin){$('adminArea').classList.remove('hidden');addQuestion()}else{$('publicArea').classList.remove('hidden');if(!surveyId){$('needIdBox').classList.remove('hidden');return}loadPublicSurvey()}}
async function adminLogin(){state.pin=$('pin').value.trim();if(!state.pin){msg('adminMsg','PIN을 입력해주세요.','err');return}msg('adminMsg','확인 중입니다...');const {data,error}=await db.rpc('get_admin_surveys',{p_pin:state.pin});if(error){msg('adminMsg',error.message||'로그인 실패','err');return}state.surveys=data||[];$('loginBox').classList.add('hidden');$('adminPanel').classList.remove('hidden');renderSurveyList();msg('adminMsg','')}
async function loadAdminSurveys(){const {data,error}=await db.rpc('get_admin_surveys',{p_pin:state.pin});if(error){msg('saveMsg',error.message||'설문 목록을 불러오지 못했습니다.','err');return}state.surveys=data||[];renderSurveyList()}
function renderSurveyList(){const box=$('surveyList');if(!state.surveys.length){box.innerHTML='<div class="muted">등록된 설문이 없습니다.</div>';return}box.innerHTML=state.surveys.map(s=>`<div class="survey-item"><div class="between"><div><b>${esc(s.title)}</b><div class="muted">응답 ${Number(s.response_count||0)}명 · ${s.is_public?'공개':'숨김'} · 기한 ${esc(koDate(s.deadline_at))||'없음'}</div></div><a class="btn mini blue" href="${esc(surveyLink(s.id))}" target="_blank">열기</a></div><div class="linkbox">${esc(surveyLink(s.id))}</div></div>`).join('')}
function addQuestion(){const wrap=$('questionEditor');const idx=wrap.children.length+1;const div=document.createElement('div');div.className='q-card';div.innerHTML=`<div class="between"><h3>문항 ${idx}</h3><button class="btn mini danger" type="button" onclick="this.closest('.q-card').remove();renumberQuestions()">삭제</button></div><div class="field"><label>문항 내용</label><input class="q-text" placeholder="예: 참석 가능하신가요?" /></div><label class="option"><input class="q-multi" type="checkbox" /> <span>복수 선택 허용</span></label><div class="field"><label>선택지</label><textarea class="q-options" placeholder="한 줄에 하나씩 입력&#10;참석&#10;불참&#10;미정"></textarea></div>`;wrap.appendChild(div)}
function renumberQuestions(){[...$('questionEditor').children].forEach((el,i)=>{el.querySelector('h3').textContent='문항 '+(i+1)})}
function resetForm(){ $('surveyTitle').value='';$('surveyDescription').value='';$('surveyDeadline').value='';$('surveyPublic').checked=true;$('questionEditor').innerHTML='';addQuestion();msg('saveMsg','') }
async function saveSurvey(){const questions=[...$('questionEditor').children].map((el,i)=>({question_text:el.querySelector('.q-text').value.trim(),allow_multiple:el.querySelector('.q-multi').checked,sort_order:i+1,options:el.querySelector('.q-options').value.split('\n').map(x=>x.trim()).filter(Boolean)})).filter(q=>q.question_text);if(!$('surveyTitle').value.trim()){msg('saveMsg','설문 제목을 입력해주세요.','err');return}if(!questions.length){msg('saveMsg','문항을 1개 이상 입력해주세요.','err');return}if(questions.some(q=>q.options.length<2)){msg('saveMsg','각 문항의 선택지는 2개 이상 입력해주세요.','err');return}msg('saveMsg','설문 저장 중입니다...');const {data,error}=await db.rpc('admin_save_survey',{p_pin:state.pin,p_id:null,p_title:$('surveyTitle').value.trim(),p_description:$('surveyDescription').value.trim(),p_deadline_at:localToIso($('surveyDeadline').value),p_is_public:$('surveyPublic').checked,p_questions:questions});if(error){msg('saveMsg',error.message||'설문 저장 실패','err');return}const id=data&&data.id;resetForm();msg('saveMsg','설문이 저장되었습니다. 아래 링크를 공지사항에 넣어주세요.','ok');if(id){const div=document.createElement('div');div.className='linkbox';div.textContent=surveyLink(id);$('saveMsg').appendChild(div)}await loadAdminSurveys()}
async function loadPublicSurvey(name='',phone=''){const {data,error}=await db.rpc('get_public_survey',{p_survey_id:surveyId,p_name:name,p_phone:phone});if(error){$('surveyHeader').innerHTML='<h1>설문을 불러오지 못했습니다.</h1><div class="muted">'+esc(error.message||'설문 링크를 확인해주세요.')+'</div>';return}state.survey=data.survey;state.questions=data.questions||[];state.answers=data.answers||[];state.results=data.results||[];$('publicTitle').textContent=state.survey.title||'설문조사';$('publicDescription').textContent=state.survey.description||'';$('deadlineText').textContent=state.survey.closed?'기한 종료':'기한 '+(koDate(state.survey.deadline_at)||'제한 없음');$('submitBtn').disabled=!!state.survey.closed;$('surveyBox').classList.remove('hidden');renderQuestions();renderResults(data.has_response)}
async function loadSurveyWithPerson(){const name=$('name').value.trim(),phone=$('phone').value.trim();if(!name||!phone){msg('publicMsg','이름과 연락처를 입력하면 기존 응답을 불러올 수 있습니다.','err');return}msg('publicMsg','응답 확인 중입니다...');await loadPublicSurvey(name,phone);msg('publicMsg',state.answers.length?'기존 응답을 불러왔습니다. 기한 전에는 다시 제출해 변경할 수 있습니다.':'아직 제출한 응답이 없습니다.')}
function selectedSet(qid){return new Set(state.answers.filter(a=>a.question_id===qid).map(a=>a.option_id))}
function renderQuestions(){const box=$('questionList');box.innerHTML=state.questions.map((q,i)=>{const selected=selectedSet(q.id);return `<div class="q-card"><h3>${i+1}. ${esc(q.question_text)}</h3>${(q.options||[]).map(o=>`<label class="option"><input type="${q.allow_multiple?'checkbox':'radio'}" name="q_${esc(q.id)}" value="${esc(o.id)}" ${selected.has(o.id)?'checked':''}/> <span>${esc(o.option_text)}</span></label>`).join('')}</div>`}).join('')}
function collectAnswers(){return state.questions.map(q=>({question_id:q.id,option_ids:[...document.querySelectorAll(`[name="q_${CSS.escape(q.id)}"]`)].filter(x=>x.checked).map(x=>x.value)}))}
async function submitSurvey(){const name=$('name').value.trim(),phone=$('phone').value.trim();if(!name){msg('publicMsg','이름을 입력해주세요.','err');return}if(!phone){msg('publicMsg','연락처를 입력해주세요.','err');return}const answers=collectAnswers();if(answers.some(a=>!a.option_ids.length)){msg('publicMsg','모든 문항에 응답해주세요.','err');return}msg('publicMsg','저장 중입니다...');$('submitBtn').disabled=true;const {data,error}=await db.rpc('submit_survey_response',{p_survey_id:surveyId,p_name:name,p_phone:phone,p_answers:answers});$('submitBtn').disabled=!!(state.survey&&state.survey.closed);if(error){msg('publicMsg',error.message||'저장하지 못했습니다.','err');return}state.results=data.results||[];state.answers=answers.flatMap(a=>a.option_ids.map(option_id=>({question_id:a.question_id,option_id})));msg('publicMsg','설문 응답이 저장되었습니다. 기한 전에는 다시 제출하면 변경됩니다.','ok');renderResults(true)}
function renderResults(show){const box=$('resultBox');if(!show){box.classList.add('hidden');return}box.classList.remove('hidden');$('results').innerHTML=(state.results||[]).map(r=>{const total=Number(r.total_responses||r.total||0);return `<div class="result"><h3>${esc(r.question_text)}</h3>${(r.options||[]).map(o=>{const count=Number(o.count||0),pct=total?Math.round(count*1000/total)/10:0;return `<div class="result-line"><div><b>${esc(o.option_text)}</b><div class="bar"><span style="width:${pct}%"></span></div></div><div>${count}명 · ${pct}%</div></div>`}).join('')}</div>`}).join('')||'<div class="muted">아직 결과가 없습니다.</div>'}
init();
</script>
</body>
</html>
