<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동문회 설문조사</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f6fb;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d9e1ec;border-radius:10px;padding:18px;margin:12px 0}.hidden{display:none}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#627089}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:900;cursor:pointer;background:#e8edf4;color:#182238;text-decoration:none;display:inline-block}.primary{background:#16718a;color:white}.dark{background:#26364f;color:white}.danger{background:#dc4b55;color:white}.blue{background:#2f72ee;color:white}.mini{padding:7px 10px;font-size:13px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #cfd8e5;border-radius:9px;padding:12px;font:inherit}textarea{min-height:90px}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.q,.item{border:1px solid #d9e1ec;border-radius:9px;background:#fbfdff;padding:13px;margin-top:10px}.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid #e1e7f0;border-radius:9px;background:white;padding:10px;margin:7px 0}.opt input{width:auto;margin-top:5px}.msg{min-height:22px;margin-top:10px;font-weight:800}.ok{color:#19a974}.err{color:#dc4b55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.link{word-break:break-all;background:#f5f8fc;border:1px dashed #b8c7da;border-radius:9px;padding:10px;margin-top:8px}.bar{height:12px;background:#e6edf5;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#16718a}@media(max-width:700px){.grid{grid-template-columns:1fr}.between{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="between"><h2>경인교대 파주동문회 설문조사</h2><div class="row"><a class="btn mini" href="../">메인</a><a class="btn mini dark" href="?admin=1">설문 관리</a></div></div><section id="admin" class="hidden"><div class="card"><h1>설문 관리</h1><p class="muted">설문 저장 후 생성되는 링크를 공지사항에 붙여넣으세요.</p><div id="login"><div class="field"><label>관리자 PIN</label><input id="pin" type="password" placeholder="관리자 PIN 입력"></div><button class="btn primary" onclick="login()">로그인</button><div id="adminMsg" class="msg"></div></div></div><div id="panel" class="hidden"><div class="card"><div class="between"><h2>새 설문 만들기</h2><button class="btn" onclick="addQ()">문항 추가</button></div><div class="grid"><div class="field"><label>설문 제목</label><input id="title" placeholder="설문 제목"></div><div class="field"><label>응답 기한</label><input id="deadline" type="datetime-local"></div></div><div class="field"><label>설명</label><textarea id="desc"></textarea></div><label class="opt"><input id="pub" type="checkbox" checked> 공개 사용</label><div id="qs"></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="save()">설문 저장</button><button class="btn" onclick="clearForm()">새로쓰기</button></div><div id="saveMsg" class="msg"></div></div><div class="card"><div class="between"><h2>설문 목록</h2><button class="btn" onclick="loadList()">새로고침</button></div><div id="list"></div></div><div id="adminResult" class="card hidden"><div class="between"><h2 id="adminResultTitle">응답 결과</h2><button class="btn mini" onclick="$('adminResult').classList.add('hidden')">닫기</button></div><div id="adminResultMeta" class="muted"></div><div id="adminResultList"></div></div></div></section><section id="public" class="hidden"><div class="card"><h1 id="st">설문조사</h1><div id="sd" class="muted"></div><div id="dl" class="muted"></div></div><div id="noid" class="card hidden"><b>설문 링크가 필요합니다.</b><br>공지사항의 설문 링크로 접속해주세요.</div><div id="form" class="card hidden"><div class="grid"><div class="field"><label>이름</label><input id="name" placeholder="이름 입력"></div><div class="field"><label>전화번호 끝 4자리</label><input id="phone" placeholder="예: 1234" inputmode="numeric" maxlength="4" autocomplete="off"></div></div><button class="btn" onclick="loadMine()">내 응답 불러오기</button><div id="qlist"></div><button id="submit" class="btn primary" onclick="submitVote()">설문 제출</button><div id="pubMsg" class="msg"></div></div><div id="result" class="card hidden"><h2>현재 투표상황</h2><div class="muted">설문에 참여한 사람에게만 결과가 표시됩니다.</div><div id="rlist"></div></div></section></div><script>const db=supabase.createClient('https://lemwzcchuazqpsyzsoff.supabase.co','sb_publishable_dXOuhuPizNsQgCXtqQYY4A_DBk6WCGV'),p=new URLSearchParams(location.search),sid=p.get('id')||'',isAdmin=p.get('admin')==='1',S={pin:'',surveys:[],survey:null,questions:[],answers:[],results:[]};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function msg(id,t,c=''){let e=$(id);e.className='msg '+c;e.textContent=t||''}function dt(v){if(!v)return'';let d=new Date(v);return isNaN(d)?v:d.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}function link(id){return location.origin+location.pathname+'?id='+id}function clean4(){let el=$('phone');el.value=el.value.replace(/\D/g,'').slice(0,4);return el.value}function start(){if(isAdmin){$('admin').classList.remove('hidden');addQ()}else{$('public').classList.remove('hidden');if(!sid){$('noid').classList.remove('hidden');return}loadSurvey()}}async function login(){S.pin=$('pin').value.trim();if(!S.pin)return msg('adminMsg','PIN을 입력해주세요.','err');let {data,error}=await db.rpc('get_admin_surveys',{p_pin:S.pin});if(error)return msg('adminMsg',error.message,'err');S.surveys=data||[];$('login').classList.add('hidden');$('panel').classList.remove('hidden');renderList()}async function loadList(){let {data,error}=await db.rpc('get_admin_surveys',{p_pin:S.pin});if(error)return msg('saveMsg',error.message,'err');S.surveys=data||[];renderList()}function renderList(){$('list').innerHTML=S.surveys.length?S.surveys.map(s=>`<div class="item"><b>${esc(s.title)}</b><div class="muted">응답 ${s.response_count||0}명 · ${s.is_public?'공개':'숨김'} · ${dt(s.deadline_at)||'기한 없음'}</div><div class="link">${esc(link(s.id))}</div><div class="row"><a class="btn mini blue" target="_blank" href="${esc(link(s.id))}">열기</a><button class="btn mini primary" onclick="showAdminResults('${esc(s.id)}')">결과 보기</button></div></div>`).join(''):'<div class="muted">등록된 설문이 없습니다.</div>'}async function showAdminResults(id){msg('saveMsg','결과를 불러오는 중입니다.');let {data,error}=await db.rpc('get_admin_survey_results',{p_pin:S.pin,p_survey_id:id});if(error)return msg('saveMsg',error.message,'err');msg('saveMsg','');$('adminResultTitle').textContent=(data.survey&&data.survey.title?data.survey.title:'응답')+' 결과';$('adminResultMeta').textContent=`응답 ${data.survey&&data.survey.response_count||0}명 · ${data.survey&&data.survey.is_public?'공개':'숨김'} · ${dt(data.survey&&data.survey.deadline_at)||'기한 없음'}`;renderAdminResults(data.results||[]);$('adminResult').classList.remove('hidden');$('adminResult').scrollIntoView({behavior:'smooth',block:'start'})}function renderAdminResults(results){$('adminResultList').innerHTML=(results||[]).map(r=>{let total=Number(r.total_responses||r.total||0);return `<div class="q"><h3>${esc(r.question_text)}</h3>${r.options.map(o=>{let cnt=Number(o.count||0),pct=total?Math.round(cnt*1000/total)/10:0;return `<b>${esc(o.option_text)}</b><div class="bar"><span style="width:${pct}%"></span></div><div class="muted">${cnt}명 · ${pct}%</div>`}).join('')}</div>`}).join('')||'<div class="muted">아직 결과가 없습니다.</div>'}function addQ(){let i=$('qs').children.length+1,d=document.createElement('div');d.className='q';d.innerHTML=`<div class="between"><h3>문항 ${i}</h3><button class="btn mini danger" onclick="this.closest('.q').remove();renum()">삭제</button></div><div class="field"><label>문항 내용</label><input class="qt"></div><label class="opt"><input class="qm" type="checkbox"> 복수 선택 허용</label><div class="field"><label>선택지</label><textarea class="qo" placeholder="한 줄에 하나씩 입력"></textarea></div>`;$('qs').appendChild(d)}function renum(){[...$('qs').children].forEach((e,i)=>e.querySelector('h3').textContent='문항 '+(i+1))}function clearForm(){$('title').value='';$('desc').value='';$('deadline').value='';$('pub').checked=true;$('qs').innerHTML='';addQ();msg('saveMsg','')}async function save(){let questions=[...$('qs').children].map((e,i)=>({question_text:e.querySelector('.qt').value.trim(),allow_multiple:e.querySelector('.qm').checked,sort_order:i+1,options:e.querySelector('.qo').value.split('\n').map(x=>x.trim()).filter(Boolean)})).filter(q=>q.question_text);if(!$('title').value.trim())return msg('saveMsg','설문 제목을 입력해주세요.','err');if(!questions.length)return msg('saveMsg','문항을 입력해주세요.','err');if(questions.some(q=>q.options.length<2))return msg('saveMsg','선택지는 2개 이상 필요합니다.','err');let {data,error}=await db.rpc('admin_save_survey',{p_pin:S.pin,p_id:null,p_title:$('title').value.trim(),p_description:$('desc').value.trim(),p_deadline_at:$('deadline').value?new Date($('deadline').value).toISOString():null,p_is_public:$('pub').checked,p_questions:questions});if(error)return msg('saveMsg',error.message,'err');let id=data&&data.id;clearForm();msg('saveMsg','설문이 저장되었습니다.','ok');if(id){let div=document.createElement('div');div.className='link';div.textContent=link(id);$('saveMsg').appendChild(div)}loadList()}async function loadSurvey(n='',ph=''){let {data,error}=await db.rpc('get_public_survey',{p_survey_id:sid,p_name:n,p_phone:ph});if(error){$('st').textContent='설문을 불러오지 못했습니다';$('sd').textContent=error.message;return}S.survey=data.survey;S.questions=data.questions||[];S.answers=data.answers||[];S.results=data.results||[];$('st').textContent=S.survey.title;$('sd').textContent=S.survey.description||'';$('dl').textContent=S.survey.closed?'기한 종료':'기한 '+(dt(S.survey.deadline_at)||'제한 없음');$('form').classList.remove('hidden');$('submit').disabled=!!S.survey.closed;renderQ();renderR(data.has_response)}async function loadMine(){let ph=clean4();if(!$('name').value.trim()||ph.length!==4)return msg('pubMsg','이름과 전화번호 끝 4자리를 입력해주세요.','err');await loadSurvey($('name').value.trim(),ph);msg('pubMsg',S.answers.length?'기존 응답을 불러왔습니다.':'제출한 응답이 없습니다.')}function chosen(qid){return new Set(S.answers.filter(a=>a.question_id===qid).map(a=>a.option_id))}function renderQ(){$('qlist').innerHTML=S.questions.map((q,i)=>{let c=chosen(q.id);return `<div class="q"><h3>${i+1}. ${esc(q.question_text)}</h3>${q.options.map(o=>`<label class="opt"><input type="${q.allow_multiple?'checkbox':'radio'}" name="q_${esc(q.id)}" value="${esc(o.id)}" ${c.has(o.id)?'checked':''}> ${esc(o.option_text)}</label>`).join('')}</div>`}).join('')}function answers(){return S.questions.map(q=>({question_id:q.id,option_ids:[...document.querySelectorAll(`[name="q_${CSS.escape(q.id)}"]`)].filter(x=>x.checked).map(x=>x.value)}))}async function submitVote(){let n=$('name').value.trim(),ph=clean4();if(!n||ph.length!==4)return msg('pubMsg','이름과 전화번호 끝 4자리를 입력해주세요.','err');let a=answers();if(a.some(x=>!x.option_ids.length))return msg('pubMsg','모든 문항에 응답해주세요.','err');let {data,error}=await db.rpc('submit_survey_response',{p_survey_id:sid,p_name:n,p_phone:ph,p_answers:a});if(error)return msg('pubMsg',error.message,'err');S.results=data.results||[];msg('pubMsg','설문 응답이 저장되었습니다. 기한 전에는 다시 제출하면 변경됩니다.','ok');renderR(true)}function renderR(show){if(!show){$('result').classList.add('hidden');return}$('result').classList.remove('hidden');$('rlist').innerHTML=(S.results||[]).map(r=>{let total=Number(r.total_responses||r.total||0);return `<div class="q"><h3>${esc(r.question_text)}</h3>${r.options.map(o=>{let cnt=Number(o.count||0),pct=total?Math.round(cnt*1000/total)/10:0;return `<b>${esc(o.option_text)}</b><div class="bar"><span style="width:${pct}%"></span></div><div class="muted">${cnt}명 · ${pct}%</div>`}).join('')}</div>`}).join('')||'<div class="muted">아직 결과가 없습니다.</div>'}document.addEventListener('input',e=>{if(e.target&&e.target.id==='phone')clean4()});start();</script></body></html>
